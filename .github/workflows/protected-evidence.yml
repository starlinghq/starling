name: protected-evidence

# Plan 10.1 and 12, backlog P-007: a pull request that changes protected fixtures, conformance
# expectations or tolerances must carry the `protected-change` label and must not also change
# implementation code, so an implementation job cannot move its own thresholds. Runs again when
# labels change. Reads the event payload only; no secrets, read-only token.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  protected-evidence:
    name: protected evidence changes
    runs-on: [self-hosted, omarchy]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e model-pipeline
      - name: Check protected changes
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: model-pipeline check-protected --base "$BASE_SHA" --head "$HEAD_SHA" --labels-json "$PR_LABELS"
