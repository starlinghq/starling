name: protected-evidence

# Plan 10.1 and 12, backlog P-007: a pull request that changes protected fixtures, conformance
# expectations or tolerances must carry the `protected-change` label and must not also change
# implementation code, so an implementation job cannot move its own thresholds. Runs again when
# labels change. Reads the event payload only; no secrets, read-only token. The checker and its
# rules are installed from the base commit, not from the pull request, so a pull request cannot
# loosen the rules it is checked against without also editing this file; that edit is caught by
# required code-owner review on .github/, not by this check (.github/workflows/README.md, "Limit").
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  protected-evidence:
    name: protected evidence changes
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "omarchy"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check out the checker from the base commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e base/model-pipeline
      - name: Check protected changes
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Runs from the workspace root, so the repository it diffs is the pull request checkout.
        run: model-pipeline check-protected --base "$BASE_SHA" --head "$HEAD_SHA" --labels-json "$PR_LABELS"
