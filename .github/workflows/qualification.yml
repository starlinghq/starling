name: qualification

# Scheduled qualification (plan section 13.1 "trusted model qualification" and "periodic maintenance"; backlog P-018,
# workstream R6 of docs/plan/production-readiness.md). Weekly, on release tags (ai-v*) and on manual dispatch only: never
# on pull_request, so no fork code runs here, and no job can reach release credentials (the `release` environment is used only by
# release.yml). Every job uses the read-only workflow token, and every job but `cuda` uses no secret: only publicly
# hosted, pinned model assets are acquired, anonymously. Every registered graph is public since 2026-10-14 (maintainer action M3). A profile whose
# manifest records a `source_status` of `placeholder` or `private` is skipped with a "hosting private" notice;
# tools/qualification.py reads that from each manifest.
#
# This workflow is the regression support of the Stable profiles (docs/support-policy.md, "Regression support"): the
# release-gates job reruns G1, G2 and G3 of each Stable CPU profile on its accepted P-030 release sets, and the soak job
# screens each for growth: CPU regression runs weekly (and on every release tag). The cuda job does the same for every
# CUDA profile on a RunPod GPU pod, for every release (an ai-v* tag push) and on manual dispatch, not weekly. A failure
# there is handled like a regression report.
#
# Jobs:
#   assets         the lock of every public CPU profile (tools/qualification.py), uploaded as evidence. Each job that
#                  needs models acquires them itself with tools/acquire-models.sh (anonymous Hub download, size and
#                  SHA-256 verified): all CPU models together exceed the 10 GB actions/cache limit
#   model-tests    the weight-dependent .NET tests, with the models present
#   evaluator      the protected staged evaluator on the development fixtures, G1 and G2 required, per CPU profile with
#                  an onboarding recipe, plus the G3 task-quality evaluator on the public SMOKE example (not gate evidence)
#   experimental   the onboarding routes of the Experimental CPU profiles of Kev-0.8B, QwenChat (Qwen3, Qwen2.5) and
#                  Whisper on their candidate contracts: development comparisons that report (step summary, warning,
#                  artifact) and never gate (continue-on-error); no gate or maturity changes
#   release-gates  G1, G2 and G3 on the accepted P-030 release sets (tools/release-gates.sh) for the Stable CPU profiles,
#                  with the commands of docs/evidence/release-set-gates-2026-10-14/; every gate must pass
#   soak           a one-hour G4 soak per CPU profile (the qualification length; a 10-minute run sits in the allocator's
#                  warm-up ramp and trips the growth rule for e5, as the 2026-10-13 screening did)
#   catalog        the generated catalog, compatibility matrix and package README maturity blocks are not stale
#   upstream       upstream change detection (P-020): fails when a pinned Hub repository has a revision newer than the
#                  manifest's latest_known_upstream_revision, so the maintainer is notified by the failed run
#   cuda           regression support of the CUDA profiles on a RunPod GPU pod (tools/ci/runpod.py, runpod-cuda-pod.sh):
#                  the CUDA test projects, release-set G1, G2 and G3 of every CUDA profile, and a short soak smoke test
#                  per CUDA profile. Per release (ai-v* tags) and on dispatch, not on the schedule. The only job with a secret (RUNPOD_API_KEY, used on the runner only, never on the pod)
#
# Evidence from every job is uploaded as an artifact, also when a step fails. Nothing here changes a manifest, a gate
# or a maturity: the maintainer records results (M10).
on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC: the CPU jobs (the cuda job does not run on the schedule)
  # GPU regression per release: a release tag runs every job, the cuda job included.
  push:
    tags: ["ai-v*"]
  workflow_dispatch:
    inputs:
      soak_duration:
        description: "Soak duration per profile (Starlings.Soak.Tool --duration; 1h is the qualification length)"
        type: string
        default: 1h
      cuda_soak_duration:
        description: "Soak duration per CUDA profile on the RunPod pod (job cuda; 10m screens, 1h is the G4 length)"
        type: string
        default: 10m
      # A CPU-only dispatch skips the paid RunPod job (for example while the RunPod balance is low). Scheduled runs
      # always include it.
      skip_cuda:
        description: "Skip the cuda (runpod) job: run the CPU jobs only"
        type: boolean
        default: false
      # Allocator diagnostics, added on the GitHub-hosted runner used until 2026-10-22 and kept on the self-hosted
      # `qualification` runner (docs/evidence/scheduled-regression-fix/). The defaults leave the
      # qualification run unchanged.
      soak_only:
        description: "Diagnostics: run only the soak jobs (skip model tests, evaluator, release gates, catalog, upstream)"
        type: boolean
        default: false
      soak_workloads:
        description: "Diagnostics: space-separated soak workloads to run (e5 gliner2 ...); empty runs all"
        type: string
        default: ""
      soak_variants:
        description: >-
          Diagnostics: JSON array of soak variants, each '+'-joined from default, no-heap-trim (tool --no-heap-trim),
          tool-trim (--malloc-trim), smaps (--smaps-every 25), smaps5 (--smaps-every 5), keep-loaded (--keep-loaded), load-trim (--trim-after-load), cpu-arena / no-arena (--cpu-arena, --no-cpu-arena), run-threads / no-run-threads (--run-threads, --no-run-threads), lib-load-trim / no-load-trim (--load-trim, --no-load-trim), run-trim / no-run-trim (--run-trim, --no-run-trim), thp-always (keep the image's THP setting), mmap64k (MALLOC_MMAP_THRESHOLD_=65536), arena2 (MALLOC_ARENA_MAX=2), no-env
          (drop the profile's documented MALLOC_ setting)
        type: string
        default: '["default"]'

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: false

# STARLING_MODELS (the model cache) is set per job by its "Model cache" step, never here: a workflow-level value would
# take precedence over the step's $GITHUB_ENV entry.
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true
  EVIDENCE: ${{ github.workspace }}/artifacts/qualification
  # The CPU profiles of the registry. A new CPU profile is added here; tools/qualification.py decides its hosting.
  CPU_PROFILES: >-
    multilingual-e5-small/onnx-fp32-cpu
    gliner2-base-v1/onnx-fp32-cpu
    embeddinggemma-2/onnx-fp32-cpu
    embeddinggemma-2/image-fp32-cpu
    embeddinggemma-2/video-fp32-cpu
    qwen3.5-0.8b/ortgenai-fp32x-cpu

jobs:
  assets:
    name: model locks
    if: github.repository == 'starlinghq/starling'
    runs-on: qualification
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install -e model-pipeline
      # One lock per public profile, from the manifest's origin.files (paths, sizes, SHA-256 at the pinned commit;
      # files Starling hosts carry their address). Fails early when a manifest cannot be locked.
      - name: Locks of the public profiles
        run: |
          mkdir -p "$EVIDENCE/locks"
          for profile in $CPU_PROFILES; do
            manifest="model-pipeline/registry/$profile/manifest.yaml"
            hosting="$(python3 -I tools/qualification.py hosting "$manifest")"
            if [[ "$hosting" != public ]]; then
              echo "::notice title=$profile skipped::hosting private (M3): $hosting"
              continue
            fi
            extra=()
            if [[ -f "model-pipeline/protected/$profile/environment.json" ]]; then
              extra=(--reference-environment "model-pipeline/protected/$profile/environment.json")
            fi
            python3 -I tools/qualification.py lock "$manifest" "$EVIDENCE/locks/${profile//\//--}.json" "${extra[@]}"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qualification-locks
          path: artifacts/qualification/locks/
          if-no-files-found: ignore

  model-tests:
    name: model tests (linux x64 cpu)
    needs: assets
    if: ${{ !inputs.soak_only }}
    runs-on: qualification
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install -e model-pipeline
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      # The runner's temporary disk (/mnt) holds the models when it exists: all CPU profiles are about 12 GB.
      - name: Model cache
        run: |
          models="$GITHUB_WORKSPACE/.models"
          if [[ -d /mnt ]] && sudo -n true 2>/dev/null; then
            sudo mkdir -p /mnt/starling-models && sudo chown "$(id -u):$(id -g)" /mnt/starling-models
            models=/mnt/starling-models
          fi
          echo "STARLING_MODELS=$models" >>"$GITHUB_ENV"
          df -h / "$(dirname "$models")"
      - name: Acquire and verify
        run: |
          # shellcheck disable=SC2086 # CPU_PROFILES is a word list
          tools/acquire-models.sh "$EVIDENCE/locks" $CPU_PROFILES
          tools/fetch-tokenizer-assets.sh
      - run: dotnet build ai-dotnet/AI.slnx --configuration Release
      # Tests of models whose files are absent (private hosting) still skip, with the reason in the report. One test
      # module at a time: several modules each loading their models exhausted the memory of the GitHub-hosted runner
      # used until 2026-10-22 (the first dispatched run lost its runner that way), and the self-hosted runner shares its
      # host with other jobs.
      - name: Tests with the public models
        run: |
          dotnet test --solution ai-dotnet/AI.slnx --configuration Release --no-build --max-parallel-test-modules 1 \
            --results-directory "$EVIDENCE/model-tests" -- --report-xunit-trx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qualification-model-tests
          path: artifacts/qualification/model-tests/
          if-no-files-found: warn

  evaluator:
    name: evaluator ${{ matrix.profile }}
    needs: assets
    if: ${{ !inputs.soak_only }}
    runs-on: qualification
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: multilingual-e5-small/onnx-fp32-cpu
            recipe: model-pipeline/recipes/multilingual-e5-small-cpu.yaml
            reference: model-pipeline/reference/encoder/requirements.txt
            g3: retrieval
            g3_model: e5
          # No onboarding recipe: their development-fixture evaluation is not wired here. Their regression gates are
          # the release-set evaluations of the release-gates job.
          - profile: gliner2-base-v1/onnx-fp32-cpu
          - profile: embeddinggemma-2/onnx-fp32-cpu
          - profile: embeddinggemma-2/image-fp32-cpu
          - profile: embeddinggemma-2/video-fp32-cpu
          - profile: qwen3.5-0.8b/ortgenai-fp32x-cpu
    env:
      PROFILE: ${{ matrix.profile }}
      MANIFEST: model-pipeline/registry/${{ matrix.profile }}/manifest.yaml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # the evaluator verifies protected evidence against its merge base with origin/main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install -e model-pipeline
      - name: Hosting
        id: hosting
        run: |
          python3 -I tools/qualification.py hosting "$MANIFEST" | tee hosting.txt
          if ! grep -qx public hosting.txt; then
            echo "::notice title=$PROFILE skipped::hosting private (M3): G1/G2 not run. $(cat hosting.txt)"
          fi
      # A public profile without a CI runner is reported, not passed: G1 and G2 stay not-run for it.
      - name: Runner wired
        id: wired
        if: steps.hosting.outputs.hosting == 'public'
        env:
          RECIPE: ${{ matrix.recipe }}
        run: |
          if [[ -z "$RECIPE" ]]; then
            echo "::notice title=$PROFILE development-fixture G1/G2 not run::no onboarding recipe is wired for this profile in qualification.yml"
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: steps.wired.outputs.run == 'true'
        with:
          global-json-file: global.json
      - name: Model cache
        if: steps.wired.outputs.run == 'true'
        run: echo "STARLING_MODELS=$GITHUB_WORKSPACE/.models" >>"$GITHUB_ENV"
      - name: Acquire and verify
        if: steps.wired.outputs.run == 'true'
        run: tools/acquire-models.sh "$RUNNER_TEMP/locks" "$PROFILE"
      # The reference environment (model-pipeline/ONBOARDING.md, "Prepare"), installed from the hash-locked requirements.
      - name: Reference environment
        if: steps.wired.outputs.run == 'true'
        env:
          REFERENCE: ${{ matrix.reference }}
        run: |
          pip install uv==0.12.19
          uv venv --python 3.11 "$RUNNER_TEMP/venv-reference"
          uv pip install --python "$RUNNER_TEMP/venv-reference/bin/python" --require-hashes -r "$REFERENCE" \
            --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match
          uv pip install --python "$RUNNER_TEMP/venv-reference/bin/python" -e model-pipeline
      # Recipe stages assets (every manifest file verified), environment, reference, export, dotnet, evaluate (the
      # protected evaluator; G1 and G2 must pass), review. Exit 1 when a stage fails.
      - name: G1/G2 (protected evaluator)
        if: steps.wired.outputs.run == 'true'
        env:
          RECIPE: ${{ matrix.recipe }}
        run: |
          python3 -I tools/qualification.py lock "$MANIFEST" "$RUNNER_TEMP/snapshot.lock.json" \
            --reference-environment "model-pipeline/protected/$PROFILE/environment.json"
          snapshot="$STARLING_MODELS/$(python3 -I tools/qualification.py snapshot "$RUNNER_TEMP/snapshot.lock.json")"
          out="$EVIDENCE/evaluator/${PROFILE//\//--}"
          model-pipeline run "$RECIPE" --snapshot "$snapshot" --reference-python "$RUNNER_TEMP/venv-reference/bin/python" \
            --out "$out/run" --threads 2 --timeout 3600
      # G3 on the hand-written SMOKE example only (model-pipeline/tests/fixtures/g3-smoke): it exercises the
      # producer and the metrics. No budget file exists for it, so the evaluator reports "no budget: not a gate
      # result" with exit 4, which is accepted here; any other non-zero exit fails. The release-set G3 runs in the
      # release-gates job.
      - name: G3 smoke (not gate evidence)
        if: steps.wired.outputs.run == 'true' && matrix.g3 != ''
        env:
          G3: ${{ matrix.g3 }}
          G3_MODEL: ${{ matrix.g3_model }}
        run: |
          out="$EVIDENCE/evaluator/${PROFILE//\//--}/g3-smoke"
          mkdir -p "$out"
          dataset="model-pipeline/tests/fixtures/g3-smoke/$G3"
          dotnet run --project ai-dotnet/tools/Starlings.Fidelity.Tool -c Release -- "$G3" --model "$G3_MODEL" \
            --dataset "$dataset" --out "$out/candidate.jsonl"
          status=0
          model-pipeline evaluate "$MANIFEST" --g3 "$G3" --dataset "$dataset" --results "$out/candidate.jsonl" \
            --out "$out" || status=$?
          if [[ "$status" != 0 && "$status" != 4 ]]; then
            exit "$status"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.wired.outputs.run == 'true'
        with:
          name: qualification-evaluator-${{ strategy.job-index }}
          path: artifacts/qualification/evaluator/
          if-no-files-found: warn

  # Experimental profiles: report, never gate. The onboarding routes of the Experimental CPU profiles of Kev, QwenChat
  # and Whisper (model-pipeline/ONBOARDING.md, model-pipeline/FIVE_MODELS.md), run end to end on their candidate
  # contracts: fresh reference, backend and .NET stages, then the route's evaluator with its predeclared development
  # policy. These are development comparisons, not gates: no reference is adopted, no gate or maturity changes, and
  # the job is continue-on-error, so a failure shows in the run (a warning annotation and the step summary) without
  # failing the workflow. Kev-4B is left out (no binding tolerances, about 16 GB of fp32 weights on CPU). The e5 browser
  # profiles have their own job (`browser`). Snapshots are acquired anonymously from the candidates' origin.files (and
  # origin.base) with tools/qualification.py lock-candidate and Starlings.Acquisition.Tool, size and SHA-256 verified.
  experimental:
    name: experimental ${{ matrix.id }} (reports, does not gate)
    if: github.repository == 'starlinghq/starling' && !inputs.soak_only
    runs-on: qualification
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: kev-0.8b
            recipe: model-pipeline/recipes/kev-0.8b-cpu.yaml
            candidate: model-pipeline/candidates/kev-0.8b/profile.json
            reference: model-pipeline/reference/kev/requirements.txt
            python: "3.12"
            torch_index: https://download.pytorch.org/whl/cpu
            base: hf-cache
            kev_code: true
          - id: qwen3
            recipe: model-pipeline/recipes/qwen3-cpu.yaml
            candidate: model-pipeline/candidates/qwen3/profile.json
            reference: model-pipeline/reference/generation/requirements.txt
            python: "3.12"
            torch_index: https://download.pytorch.org/whl/cu130
          - id: qwen25
            recipe: model-pipeline/recipes/qwen25-cpu.yaml
            candidate: model-pipeline/candidates/qwen25/profile.json
            reference: model-pipeline/reference/generation/requirements.txt
            python: "3.12"
            torch_index: https://download.pytorch.org/whl/cu130
          - id: whisper-large-v3-turbo
            recipe: model-pipeline/recipes/whisper-large-v3-turbo-cpu.yaml
            candidate: model-pipeline/candidates/whisper-large-v3-turbo/profile.json
            reference: model-pipeline/reference/whisper/requirements.txt
            python: "3.11"
            torch_index: https://download.pytorch.org/whl/cpu
            base: plain
    env:
      ID: ${{ matrix.id }}
      CANDIDATE: ${{ matrix.candidate }}
      BASE: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install -e model-pipeline
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Model cache
        run: echo "STARLING_MODELS=$GITHUB_WORKSPACE/.models" >>"$GITHUB_ENV"
      # The candidate's snapshot, and its base where the route has one, into $STARLING_MODELS/<repository>/<revision>.
      - name: Acquire and verify
        id: acquire
        run: |
          locks="$RUNNER_TEMP/locks"
          mkdir -p "$locks" "$STARLING_MODELS"
          dotnet build ai-dotnet/tools/Starlings.Acquisition.Tool --configuration Release --nologo -v quiet
          tool=ai-dotnet/tools/Starlings.Acquisition.Tool/bin/Release/net10.0/Starlings.Acquisition.Tool.dll
          python3 -I tools/qualification.py lock-candidate "$CANDIDATE" "$locks/snapshot.json"
          env -u HF_TOKEN dotnet "$tool" download "$locks/snapshot.json" --cache "$STARLING_MODELS"
          echo "snapshot=$STARLING_MODELS/$(python3 -I tools/qualification.py snapshot "$locks/snapshot.json")" >>"$GITHUB_OUTPUT"
          if [[ -n "$BASE" ]]; then
            python3 -I tools/qualification.py lock-candidate "$CANDIDATE" "$locks/base.json" --base
            env -u HF_TOKEN dotnet "$tool" download "$locks/base.json" --cache "$STARLING_MODELS"
            base_dir="$STARLING_MODELS/$(python3 -I tools/qualification.py snapshot "$locks/base.json")"
            if [[ "$BASE" == hf-cache ]]; then
              # The Kev route loads its base through transformers, offline, from a Hugging Face cache layout:
              # <cache>/models--<org>--<name>/snapshots/<revision>. Hard links (a copy across file systems) keep every
              # file inside that cache, as the route requires.
              repo="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["repository"])' "$locks/base.json")"
              hf="$RUNNER_TEMP/hf-cache/models--${repo//\//--}/snapshots/$(basename "$base_dir")"
              mkdir -p "$hf"
              cp -al "$base_dir/." "$hf/" 2>/dev/null || cp -a "$base_dir/." "$hf/"
              base_dir="$hf"
            fi
            echo "base=$base_dir" >>"$GITHUB_OUTPUT"
          fi
      # The route's hash-locked reference environment, plus the pipeline (and for Kev its code at the pinned commit,
      # installed with --no-deps from a clean checkout, which the route's environment stage verifies).
      - name: Reference environment
        env:
          REFERENCE: ${{ matrix.reference }}
          PYTHON: ${{ matrix.python }}
          TORCH_INDEX: ${{ matrix.torch_index }}
          KEV_CODE: ${{ matrix.kev_code }}
        run: |
          pip install uv==0.12.19
          uv venv --python "$PYTHON" "$RUNNER_TEMP/venv-reference"
          uv pip install --python "$RUNNER_TEMP/venv-reference/bin/python" --require-hashes -r "$REFERENCE" \
            --index-url https://pypi.org/simple --extra-index-url "$TORCH_INDEX" --index-strategy unsafe-best-match
          uv pip install --python "$RUNNER_TEMP/venv-reference/bin/python" -e model-pipeline
          if [[ "$KEV_CODE" == true ]]; then
            read -r url rev < <(python3 -I -c 'import json,sys; c=json.load(open(sys.argv[1]))["origin"]["code"]; print(c["repository"], c["revision"])' "$CANDIDATE")
            git init -q "$RUNNER_TEMP/kev"
            git -C "$RUNNER_TEMP/kev" fetch -q --depth 1 "$url" "$rev"
            git -C "$RUNNER_TEMP/kev" checkout -q --detach FETCH_HEAD
            test "$(git -C "$RUNNER_TEMP/kev" rev-parse HEAD)" = "$rev"
            uv pip install --python "$RUNNER_TEMP/venv-reference/bin/python" --no-deps -e "$RUNNER_TEMP/kev"
          fi
      - name: Onboarding run (development comparison, not a gate)
        id: run
        env:
          RECIPE: ${{ matrix.recipe }}
          SNAPSHOT: ${{ steps.acquire.outputs.snapshot }}
          BASE_SNAPSHOT: ${{ steps.acquire.outputs.base }}
        run: |
          out="$EVIDENCE/experimental/$ID"
          base=()
          if [[ -n "$BASE_SNAPSHOT" ]]; then
            base=(--base-snapshot "$BASE_SNAPSHOT")
          fi
          status=0
          model-pipeline run "$RECIPE" --snapshot "$SNAPSHOT" "${base[@]}" \
            --reference-python "$RUNNER_TEMP/venv-reference/bin/python" --out "$out/run" --threads 2 --timeout 3600 \
            || status=$?
          if [[ "$status" == 0 ]]; then
            echo "Experimental \`$ID\`: onboarding run passed its development policy (not a gate)." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Experimental $ID::onboarding run exited $status; reported only, no gate changes"
            echo "Experimental \`$ID\`: onboarding run exited $status (reported, not gating)." >>"$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qualification-experimental-${{ matrix.id }}
          path: artifacts/qualification/experimental/
          if-no-files-found: warn

  # Regression support of the Stable CPU profiles: G1, G2 and G3 on the accepted P-030 release sets, with the commands
  # and pinned reference environments of docs/evidence/release-set-gates-2026-10-14/. Bounds and budgets are the
  # protected ones, verified against Git; every gate must pass. EmbeddingGemma 2's text reference embeddings are
  # committed under protected/ (#60) and also checked against the digest its reference.json records.
  # EmbeddingGemma 2 image and video and Qwen fp32x keep their G2 reference tensors outside Git (image and video soft
  # tokens and token embeddings; Qwen's full step-0 vectors): they regenerate byte-identical only on the reference CPU,
  # so a hosted regeneration would be refused on digest. The accepted bytes are hosted in the public dataset
  # Starlinghq/starling-release-references; each release set's protected hosted-reference.json pins the commit and
  # every file's SHA-256 (#71), tools/fetch-release-references.py downloads and verifies them, and the evaluator checks
  # every array against the set's own tensors.json or environment.json. These three have no Python stage 2: their
  # reference python only fetches the release media from Wikimedia Commons, and Qwen needs none.
  # The e5 browser profiles (W6): the conformance app (browser/conformance/) on the WASM backend in headless Chromium,
  # checked against the protected browser tolerances. WebGPU is not run here (no GPU on the runner); its evidence is local
  # (docs/evidence/browser-e5-package-2026-10-23/).
  browser:
    name: browser e5 (wasm, headless chromium)
    needs: assets
    if: ${{ !inputs.soak_only }}
    runs-on: qualification
    timeout-minutes: 90
    env:
      GRAPHS: ${{ github.workspace }}/.browser-graphs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # the evaluator verifies protected evidence against its merge base with origin/main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ai-dotnet/src/Shared/OnnxWeb/package-lock.json
      - run: pip install -e model-pipeline
      - name: Model cache
        run: echo "STARLING_MODELS=$GITHUB_WORKSPACE/.models" >>"$GITHUB_ENV"
      - name: Acquire and verify
        run: tools/acquire-models.sh "$RUNNER_TEMP/locks" multilingual-e5-small/onnx-fp32-cpu
      # numpy, onnx, ONNX Runtime 1.30.0 and Playwright 1.63.0 from the hash-locked browser requirements, then Playwright's
      # pinned Chromium (with its system libraries where apt is available).
      - name: Browser environment
        run: |
          pip install uv==0.12.19
          uv venv -p 3.11 "$RUNNER_TEMP/venv"
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip install --require-hashes -r model-pipeline/reference/encoder/requirements-browser.txt
          if command -v apt-get >/dev/null && sudo -n true 2>/dev/null; then
            "$RUNNER_TEMP/venv/bin/python" -m playwright install --with-deps chromium
          else
            "$RUNNER_TEMP/venv/bin/python" -m playwright install chromium
          fi
      # The int8-embed graph is not hosted: build it with the deterministic quantization script and require the pinned
      # SHA-256 (E5BrowserAssets.Int8Embed). The fp32 graph is the acquired onnx/model.onnx, hard-linked next to it.
      - name: Graphs
        run: |
          snapshot="$STARLING_MODELS/intfloat/multilingual-e5-small/614241f622f53c4eeff9890bdc4f31cfecc418b3"
          mkdir -p "$GRAPHS"
          "$RUNNER_TEMP/venv/bin/python" model-pipeline/reference/encoder/quantize_e5_browser.py \
            --model "$snapshot/onnx/model.onnx" --out "$GRAPHS"
          echo "374a3cc034a1dba112ecd1a9fba920be63f295cada3c65ab15a0a3a84739fb19  $GRAPHS/model-int8-embed.onnx" | sha256sum -c -
          ln -f "$snapshot/onnx/model.onnx" "$GRAPHS/model-fp32.onnx" || cp "$snapshot/onnx/model.onnx" "$GRAPHS/model-fp32.onnx"
      # Interpreter build (no wasm-tools workload). Not in locked restore mode: publishing a browser-wasm app re-resolves
      # the referenced libraries' trimming package (browser/conformance/README.md); the libraries' own locked restore is
      # the ai-dotnet CI job's.
      - name: Publish the conformance app
        run: dotnet publish browser/conformance/E5Conformance -c Release -p:RestoreLockedMode=false -o "$RUNNER_TEMP/conformance"
      - name: Run fp32 and int8-embed on the WASM backend
        run: |
          mkdir -p "$EVIDENCE/browser"
          for variant in fp32 int8embed; do
            "$RUNNER_TEMP/venv/bin/python" browser/conformance/run_conformance.py --publish "$RUNNER_TEMP/conformance" \
              --label interp --variant "$variant" --provider wasm --iterations 10 \
              --models-root "$STARLING_MODELS" --graphs "$GRAPHS" --out "$EVIDENCE/browser/$variant-wasm.json"
          done
      # Quick check of every bound with the harness's own evaluator (also reports latency and memory).
      - name: Check against the protected browser tolerances (harness evaluator)
        run: |
          "$RUNNER_TEMP/venv/bin/python" browser/conformance/evaluate_e5_browser.py --graphs "$GRAPHS" \
            --out "$EVIDENCE/browser/report.json" --require-pass "$EVIDENCE"/browser/*-wasm.json
      # The gate path (the one that produced the manifests' G1/G2 evidence): native ONNX Runtime on the same graph as
      # stage 2, the browser run converted to stages 1 and 3, then the protected staged evaluator with G1 and G2 required.
      - name: G1 and G2 with the protected evaluator
        env:
          FX: model-pipeline/protected/multilingual-e5-small/onnx-fp32-cpu
        run: |
          for variant in fp32 int8embed; do
            profile="multilingual-e5-small/onnx-$variant-wasm"
            if [[ $variant == fp32 ]]; then graph=model-fp32.onnx; path=onnx/model.onnx; else graph=model-int8-embed.onnx; path=onnx/model-int8-embed.onnx; fi
            results="$RUNNER_TEMP/gates/$variant/results"
            mkdir -p "$results"
            PYTHONPATH=model-pipeline/src "$RUNNER_TEMP/venv/bin/python" model-pipeline/reference/encoder/stage_e5_browser_native.py \
              --graph "$GRAPHS/$graph" --graph-path "$path" --fixtures "$FX" --profile "$profile" \
              --out "$results" --intra-op-threads 4
            model-pipeline browser-results "$EVIDENCE/browser/$variant-wasm.json" \
              --manifest "model-pipeline/registry/$profile/manifest.yaml" --fixtures "$FX" --out "$results" --machine "$(hostname)"
            model-pipeline evaluate "model-pipeline/registry/$profile/manifest.yaml" --results "$results" \
              --out "$EVIDENCE/browser/gates/$variant" --require-gates G1,G2
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qualification-browser
          path: artifacts/qualification/browser/
          if-no-files-found: ignore

  release-gates:
    name: release gates ${{ matrix.profile }}
    needs: assets
    if: ${{ !inputs.soak_only }}
    runs-on: qualification
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # One release set at a time on the self-hosted qualification runners: the video set peaks near 20 GB resident.
      max-parallel: 1
      matrix:
        include:
          - profile: multilingual-e5-small/onnx-fp32-cpu
            reference: model-pipeline/reference/encoder/requirements.txt
            hashes: --require-hashes
          - profile: embeddinggemma-2/onnx-fp32-cpu
            reference: model-pipeline/reference/embeddinggemma2/requirements.txt
            hashes: --require-hashes
          # gliner2 is pinned by a full commit of its Git repository, which cannot carry a hash, so not every
          # requirement has one; uv verifies every hash the file lists (--verify-hashes).
          - profile: gliner2-base-v1/onnx-fp32-cpu
            reference: model-pipeline/reference/gliner2/requirements-export.txt
            hashes: --verify-hashes
          - profile: embeddinggemma-2/image-fp32-cpu
            reference: model-pipeline/reference/embeddinggemma2/requirements-video.txt
            hashes: --require-hashes
          # The release-set dump keeps every decoded frame of the array rows (a 2048x1024 clip among them) for both FFmpeg
          # majors: about 20 GB peak resident on the workstation, above the 16 GB of the GitHub-hosted runner used until
          # 2026-10-22, so the job adds swap on a host without it (the first dispatched run lost its runner there).
          - profile: embeddinggemma-2/video-fp32-cpu
            reference: model-pipeline/reference/embeddinggemma2/requirements-video.txt
            hashes: --require-hashes
            swap_gb: 24
          - profile: qwen3.5-0.8b/ortgenai-fp32x-cpu
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # the evaluator verifies protected evidence against its merge base with origin/main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install -e model-pipeline
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Model cache
        run: echo "STARLING_MODELS=$GITHUB_WORKSPACE/.models" >>"$GITHUB_ENV"
      - name: Swap
        if: matrix.swap_gb != ''
        env:
          SWAP_GB: ${{ matrix.swap_gb }}
        run: |
          # The self-hosted runner has no sudo and its host already has swap; only a host without swap adds one.
          if swapon --noheadings | grep -q . || ! sudo -n true 2>/dev/null; then
            free -g
            exit 0
          fi
          dir=/mnt
          [[ -d "$dir" ]] || dir=/
          sudo swapoff -a || true
          sudo fallocate -l "${SWAP_GB}G" "$dir/starling.swap"
          sudo chmod 600 "$dir/starling.swap"
          sudo mkswap "$dir/starling.swap" >/dev/null
          sudo swapon "$dir/starling.swap"
          free -g
      - name: Acquire and verify
        run: tools/acquire-models.sh "$RUNNER_TEMP/locks" "$PROFILE"
      # Qwen fp32x has no Python step in its release gates, so it has no reference environment.
      - name: Reference environment
        if: matrix.reference != ''
        env:
          REFERENCE: ${{ matrix.reference }}
          HASHES: ${{ matrix.hashes }}
        run: |
          pip install uv==0.12.19
          uv venv --python 3.11 "$RUNNER_TEMP/venv-reference"
          uv pip install --python "$RUNNER_TEMP/venv-reference/bin/python" "$HASHES" -r "$REFERENCE" \
            --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match
          uv pip install --python "$RUNNER_TEMP/venv-reference/bin/python" -e model-pipeline
          uv pip freeze --python "$RUNNER_TEMP/venv-reference/bin/python" >"$RUNNER_TEMP/reference-freeze.txt"
      - name: Machine
        run: |
          mkdir -p "$EVIDENCE/release-gates/${PROFILE//\//--}"
          { lscpu; echo; free -g; echo; cat "$RUNNER_TEMP/reference-freeze.txt" 2>/dev/null || echo "no reference environment"; } \
            >"$EVIDENCE/release-gates/${PROFILE//\//--}/machine.txt"
          grep -m1 'Model name' /proc/cpuinfo || true
      - name: G1, G2 and G3 on the release sets
        env:
          REFERENCE: ${{ matrix.reference }}
        run: |
          refpy=()
          if [[ -n "$REFERENCE" ]]; then
            refpy=(--reference-python "$RUNNER_TEMP/venv-reference/bin/python")
          fi
          tools/release-gates.sh "$PROFILE" --out "$EVIDENCE/release-gates/${PROFILE//\//--}" \
            --work "$RUNNER_TEMP/release-gates" "${refpy[@]}" --threads 4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qualification-release-gates-${{ strategy.job-index }}
          path: artifacts/qualification/release-gates/
          if-no-files-found: warn

  soak:
    name: soak ${{ matrix.profile }}${{ matrix.variant != 'default' && format(' ({0})', matrix.variant) || '' }}
    needs: assets
    runs-on: qualification
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        workload: [e5, gliner2, embeddinggemma2, embeddinggemma2-image, embeddinggemma2-video, qwen35]
        variant: ${{ fromJSON(inputs.soak_variants || '["default"]') }}
        include:
          - { workload: e5, profile: multilingual-e5-small/onnx-fp32-cpu }
          # The documented Linux deployment setting of GLiNER2 (its README, "Memory on Linux";
          # docs/evidence/gliner2-soak-growth/): with default glibc, retained freed memory trips the growth rule.
          - { workload: gliner2, profile: gliner2-base-v1/onnx-fp32-cpu, malloc_mmap_threshold: "65536" }
          - { workload: embeddinggemma2, profile: embeddinggemma-2/onnx-fp32-cpu }
          - { workload: embeddinggemma2-image, profile: embeddinggemma-2/image-fp32-cpu }
          # Synthetic decoded clips (EmbeddingGemma2Video.FromDecodedFrames), so the soak needs no FFmpeg.
          - { workload: embeddinggemma2-video, profile: embeddinggemma-2/video-fp32-cpu }
          - { workload: qwen35, profile: qwen3.5-0.8b/ortgenai-fp32x-cpu }
    env:
      PROFILE: ${{ matrix.profile }}
      MANIFEST: model-pipeline/registry/${{ matrix.profile }}/manifest.yaml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install -e model-pipeline
      - name: Hosting
        id: hosting
        run: |
          python3 -I tools/qualification.py hosting "$MANIFEST" | tee hosting.txt
          if ! grep -qx public hosting.txt; then
            echo "::notice title=$PROFILE skipped::hosting private (M3): soak not run. $(cat hosting.txt)"
          fi
      - name: Workload wired
        id: wired
        if: steps.hosting.outputs.hosting == 'public'
        env:
          UNWIRED: ${{ matrix.unwired }}
          WORKLOAD: ${{ matrix.workload }}
          SELECTED: ${{ inputs.soak_workloads }}
        run: |
          if [[ "$UNWIRED" == true ]]; then
            echo "::warning title=$PROFILE soak not run::Starlings.Soak.Tool has no workload for this profile"
            echo "run=false" >>"$GITHUB_OUTPUT"
          elif [[ -n "$SELECTED" && " $SELECTED " != *" $WORKLOAD "* ]]; then
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: steps.wired.outputs.run == 'true'
        with:
          global-json-file: global.json
      - name: Model cache
        if: steps.wired.outputs.run == 'true'
        run: echo "STARLING_MODELS=$GITHUB_WORKSPACE/.models" >>"$GITHUB_ENV"
      - name: Acquire and verify
        if: steps.wired.outputs.run == 'true'
        run: tools/acquire-models.sh "$RUNNER_TEMP/locks" "$PROFILE"
      # The qualification length on a shared runner (GitHub-hosted until 2026-10-22, the self-hosted `qualification`
      # runner on the maintainer's workstation since #134): it screens for growth, wrong outputs and errors with the
      # tool's unchanged growth rule. It does not replace the G4 run on a quiet machine (M6), but a failure here is a
      # regression signal. Shorter runs (workflow_dispatch soak_duration) end in the warm-up ramp of glibc's resident
      # high-water mark and are expected to trip the growth rule.
      # MALLOC_MMAP_THRESHOLD_ is set only for the workload that documents it; the soak report records it.
      # Transparent huge pages: the GitHub-hosted image (used until 2026-10-22) set THP to `always`, where khugepaged
      # collapses partly used 2 MiB ranges of the malloc heaps into huge pages and fills in their absent pages, so
      # resident memory rises with no allocation behind it (docs/evidence/scheduled-regression-fix/). The soak requires
      # `madvise`, the Ubuntu kernel default, as an environment precondition (like a quiet machine): it sets it where it
      # can (sudo), and the self-hosted runner, which has no sudo, must already have it; the report records the setting.
      # The variant part thp-always keeps the host's setting.
      - name: Soak
        if: steps.wired.outputs.run == 'true'
        env:
          WORKLOAD: ${{ matrix.workload }}
          DURATION: ${{ inputs.soak_duration || '1h' }}
          MMAP_THRESHOLD: ${{ matrix.malloc_mmap_threshold }}
          VARIANT: ${{ matrix.variant }}
        run: |
          dotnet build ai-dotnet/tools/Starlings.Soak.Tool -c Release --nologo -v quiet
          note="self-hosted runner ${RUNNER_NAME}, scheduled qualification run ${GITHUB_RUN_ID}"
          extra=()
          thp=madvise
          IFS=+ read -ra parts <<<"$VARIANT"
          for part in "${parts[@]}"; do
            case "$part" in
              default) ;;
              no-heap-trim) extra+=(--no-heap-trim) ;;
              tool-trim) extra+=(--malloc-trim) ;;
              smaps) extra+=(--smaps-every 25) ;;
              smaps5) extra+=(--smaps-every 5) ;;
              keep-loaded) extra+=(--keep-loaded) ;;
              load-trim) extra+=(--trim-after-load) ;;
              cpu-arena) extra+=(--cpu-arena) ;;
              no-arena) extra+=(--no-cpu-arena) ;;
              run-threads) extra+=(--run-threads) ;;
              no-run-threads) extra+=(--no-run-threads) ;;
              lib-load-trim) extra+=(--load-trim) ;;
              no-load-trim) extra+=(--no-load-trim) ;;
              run-trim) extra+=(--run-trim) ;;
              no-run-trim) extra+=(--no-run-trim) ;;
              mmap64k) export MALLOC_MMAP_THRESHOLD_=65536 ;;
              arena2) export MALLOC_ARENA_MAX=2 ;;
              no-env) MMAP_THRESHOLD="" ;;
              thp-always) thp="" ;; # keeps the host's setting, whatever it is
              *) echo "::error::unknown soak variant part '$part'"; exit 2 ;;
            esac
          done
          thp_file=/sys/kernel/mm/transparent_hugepage/enabled
          if [[ -n "$thp" && -f "$thp_file" ]] && sudo -n true 2>/dev/null; then
            echo "$thp" | sudo tee "$thp_file" >/dev/null
          fi
          echo "transparent_hugepage: $(cat "$thp_file" 2>/dev/null || echo n/a)"
          # The precondition is checked, not assumed: a failed write fails the job instead of measuring under `always`.
          if [[ -n "$thp" && -f "$thp_file" ]] && ! grep -q "\[$thp\]" "$thp_file"; then
            echo "::error::transparent_hugepage is not [$thp] after the write"; exit 2
          fi
          if [[ -n "$MMAP_THRESHOLD" ]]; then
            export MALLOC_MMAP_THRESHOLD_="$MMAP_THRESHOLD"
            note="$note, MALLOC_MMAP_THRESHOLD_=$MMAP_THRESHOLD"
          fi
          if [[ "$VARIANT" != default ]]; then
            note="$note, variant $VARIANT"
          fi
          dotnet run --project ai-dotnet/tools/Starlings.Soak.Tool -c Release --no-build -- "$WORKLOAD" \
            --out "$EVIDENCE/soak" --duration "$DURATION" --note "$note" "${extra[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.wired.outputs.run == 'true'
        with:
          name: qualification-soak-${{ matrix.workload }}${{ matrix.variant != 'default' && format('-{0}', matrix.variant) || '' }}
          path: artifacts/qualification/soak/
          if-no-files-found: warn

  catalog:
    name: catalog up to date
    if: github.repository == 'starlinghq/starling' && !inputs.soak_only
    runs-on: qualification
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install -e model-pipeline
      # Also the per-profile maturity blocks of the package READMEs (generated from the same manifests).
      - run: model-pipeline catalog --check

  upstream:
    name: upstream change detection
    if: github.repository == 'starlinghq/starling' && !inputs.soak_only
    runs-on: qualification
    defaults:
      run:
        working-directory: model-pipeline
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install -e .
      # Read-only Hub API calls, no token. Exit 0 nothing new; 1 a newer upstream revision (this job fails, which is
      # the notification: the read-only token cannot open an issue); 2 a fetch failed. Never edits a manifest; the
      # maintainer starts the update drill (docs/plan/maintained-update-drill.md).
      - name: Detect upstream changes
        run: |
          mkdir -p "$EVIDENCE/upstream"
          status=0
          model-pipeline upstream registry --json "$EVIDENCE/upstream/upstream.json" \
            >"$EVIDENCE/upstream/upstream.md" || status=$?
          cat "$EVIDENCE/upstream/upstream.md" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$status" == 1 ]]; then
            echo "::warning title=Upstream changed::a pinned upstream repository has a newer revision; see the report"
          fi
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qualification-upstream
          path: artifacts/qualification/upstream/
          if-no-files-found: warn

  # CUDA regression support (plan 13.1: NVIDIA CUDA on Linux x64) on a RunPod GPU pod, for every release (a push of an
  # ai-v* tag) and on manual dispatch; not on the weekly schedule, never on pull_request and never in a fork. Each run creates one on-demand pod (RTX 3090 only, secure cloud
  # EU-CZ-1) named starling-q-ci-<run id>, with the network volume starling-q-vol attached (the .NET SDK, uv, the pinned
  # nvidia wheels and the verified models). The pod checks out exactly ${{ github.sha }} and runs
  # tools/ci/runpod-cuda-pod.sh: the CUDA test projects, G1, G2 and G3 of every CUDA profile on its accepted P-030
  # release sets (bounds and budgets only from protected/; the G2 references are the hosted, digest-verified ones), and a
  # short soak per CUDA profile under its contract environment. The short soak is a smoke test: wrong outputs, errors and
  # crashes fail it; its growth verdict (the tool's unchanged rule) is recorded but not binding, because a short run sits
  # in the allocator's warm-up ramp. Growth is judged by the binding one-hour G4 soaks. The results come back as the artifact qualification-cuda.
  #
  # Only tools/ci/runpod.py, on this runner, uses the repository secret RUNPOD_API_KEY (to read the balance, create,
  # inspect and terminate the pod). The secret is never echoed and never passed to the pod. The pod's SSH key is
  # generated per run and discarded with the runner. The volume pins the datacenter, so pod creation waits up to 30
  # minutes for an RTX 3090 to be in stock there. The CUDA support contracts cover the RTX 3090 (Ampere), where every CUDA
  # gate ran; no other GPU is a fallback (run 38857860186 landed on an RTX 4090, where embeddinggemma-2/video-fp32-cuda
  # failed G2: docs/evidence/gpu-regression-2026-10-16/). Without a 3090 in stock, or on a pod that reports another GPU, the
  # job fails before any test runs. Cost guard: no pod starts below a $5 balance. Caps: the job
  # timeout; a pod-side self-removal, armed by the pod's start command, as the backstop if the runner is lost; and a
  # sweep of stale starling-q-ci-* pods before each run. Only pods named starling-q-ci-* are ever touched.
  cuda:
    name: cuda (runpod)
    if: github.repository == 'starlinghq/starling' && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ai-v') || github.event_name == 'workflow_dispatch' && !inputs.soak_only && !inputs.skip_cuda)
    runs-on: qualification
    # Up to 30 min stock wait + 20 min SSH wait + POD_RUN_MINUTES + copy-back and termination, with margin.
    timeout-minutes: 290
    concurrency:
      group: qualification-cuda-runpod
      cancel-in-progress: false
    env:
      POD_NAME: starling-q-ci-${{ github.run_id }}
      SOAK_DURATION: ${{ inputs.cuda_soak_duration || '10m' }}
      # The pod removes itself this long after its creation, whatever happens to this runner. It must exceed the SSH
      # wait (20 min) plus POD_RUN_MINUTES, also in the SSH-armed fallback (BACKSTOP_MINUTES - 15): 20 + 195 < 225.
      BACKSTOP_MINUTES: "240"
      # The pod-side run must finish within this many minutes of its start; the results are copied back either way.
      # A green run takes about 107 min (38977347513); run 39012176735 needed about 180 (a CPU reference stage
      # oversubscribed the pod's CPU quota) and was cut off at the former 165 in its last soak.
      POD_RUN_MINUTES: "195"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Balance and stale pods
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python3 -I tools/ci/runpod.py preflight --min-balance 5
      - name: Ephemeral SSH key
        run: |
          ssh-keygen -q -t ed25519 -N '' -C "$POD_NAME" -f "$RUNNER_TEMP/pod_key"
          : >"$RUNNER_TEMP/known_hosts"
      - name: Create pod
        id: pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python3 -I tools/ci/runpod.py create --name "$POD_NAME" --public-key "$RUNNER_TEMP/pod_key.pub" \
            --backstop-minutes "$BACKSTOP_MINUTES" --stock-wait-minutes 30
      - name: Wait for SSH
        id: ssh
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          endpoint="$(python3 -I tools/ci/runpod.py ssh --name "$POD_NAME" --wait-minutes 20)"
          read -r ip port <<<"$endpoint"
          echo "ip=$ip" >>"$GITHUB_OUTPUT"
          echo "port=$port" >>"$GITHUB_OUTPUT"
      # No step from here to the termination has the API key in its environment.
      - name: Start the pod run
        env:
          IP: ${{ steps.ssh.outputs.ip }}
          PORT: ${{ steps.ssh.outputs.port }}
          SHA: ${{ github.sha }}
        run: |
          opts=(-i "$RUNNER_TEMP/pod_key" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o LogLevel=ERROR)
          for i in $(seq 1 40); do
            if ssh "${opts[@]}" -p "$PORT" "root@$IP" true 2>/dev/null; then break; fi
            if [[ $i == 40 ]]; then echo "::error::SSH login to the pod did not succeed"; exit 1; fi
            sleep 15
          done
          ssh "${opts[@]}" -p "$PORT" "root@$IP" 'nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader; nvidia-smi | grep -o "CUDA Version: [0-9.]*"'
          # The contracts cover the RTX 3090 only: refuse any other GPU before the pod run starts.
          gpu_name="$(ssh "${opts[@]}" -p "$PORT" "root@$IP" 'nvidia-smi --query-gpu=name --format=csv,noheader | head -1')"
          if [[ "$gpu_name" != "NVIDIA GeForce RTX 3090" ]]; then
            echo "::error title=Wrong GPU::the pod has '$gpu_name', not the NVIDIA GeForce RTX 3090 the CUDA contracts cover; no run on another GPU"
            exit 1
          fi
          driver="$(ssh "${opts[@]}" -p "$PORT" "root@$IP" 'nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -1')"
          if (( ${driver%%.*} < 580 )); then echo "::error::driver $driver is older than CUDA 13 needs (580)"; exit 1; fi
          # The pod-side backstop: confirm that the start command armed it, else arm it over SSH.
          if ssh "${opts[@]}" -p "$PORT" "root@$IP" "pgrep -f '[s]leep $((BACKSTOP_MINUTES * 60))' >/dev/null"; then
            echo "pod-side backstop armed by the start command ($BACKSTOP_MINUTES min after creation)"
          elif ssh "${opts[@]}" -p "$PORT" "root@$IP" "command -v runpodctl >/dev/null && test -n \"\${RUNPOD_POD_ID:-}\" && { setsid nohup sh -c 'sleep $((BACKSTOP_MINUTES * 60 - 900)); runpodctl remove pod \"\$RUNPOD_POD_ID\"' >/var/log/starling-backstop.log 2>&1 < /dev/null & }"; then
            echo "pod-side backstop armed over SSH"
          else
            echo "::warning::pod-side backstop not armed (no runpodctl or RUNPOD_POD_ID); the job timeout and the next run's sweep remain"
          fi
          scp -q -i "$RUNNER_TEMP/pod_key" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o LogLevel=ERROR -P "$PORT" \
            tools/ci/runpod-cuda-pod.sh "root@$IP:/root/runpod-cuda-pod.sh"
          ssh "${opts[@]}" -p "$PORT" "root@$IP" "mkdir -p /root/ci-out && { setsid nohup bash /root/runpod-cuda-pod.sh $SHA /root/ci-out $SOAK_DURATION > /root/ci-out/run.log 2>&1 < /dev/null & } ; sleep 10; if test -s /root/ci-out/status.txt; then echo 'pod run started'; else tail -n 20 /root/ci-out/run.log; exit 1; fi"
      - name: Pod run (CUDA tests, release gates, soaks)
        env:
          IP: ${{ steps.ssh.outputs.ip }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          opts=(-i "$RUNNER_TEMP/pod_key" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=20
            -o ServerAliveInterval=30 -o LogLevel=ERROR -p "$PORT")
          end=$((SECONDS + POD_RUN_MINUTES * 60))
          seen=0
          while (( SECONDS < end )); do
            sleep 60
            # shellcheck disable=SC2029 # the line offset is meant to expand on the runner
            if ! lines="$(ssh "${opts[@]}" "root@$IP" "tail -n +$((seen + 1)) /root/ci-out/status.txt 2>/dev/null; test -f /root/ci-out/DONE && echo __DONE__")"; then
              echo "(ssh poll failed)"
              continue
            fi
            new="$(grep -v '^__DONE__$' <<<"$lines" || true)"
            if [[ -n "$new" ]]; then
              echo "$new"
              seen=$((seen + $(wc -l <<<"$new")))
            fi
            if grep -q '^__DONE__$' <<<"$lines"; then exit 0; fi
          done
          echo "::error::the pod run did not finish within $POD_RUN_MINUTES minutes; the partial results are in the artifact"
          exit 1
      - name: Copy results back
        if: always() && steps.ssh.outputs.ip != ''
        env:
          IP: ${{ steps.ssh.outputs.ip }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          mkdir -p "$EVIDENCE/cuda"
          ssh -i "$RUNNER_TEMP/pod_key" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=20 -o LogLevel=ERROR \
            -p "$PORT" "root@$IP" 'tar cf - -C /root/ci-out .' | tar xf - -C "$EVIDENCE/cuda" || echo "copy incomplete"
          if [[ -f "$EVIDENCE/cuda/summary.md" ]]; then
            cat "$EVIDENCE/cuda/summary.md" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            tail -n 60 "$EVIDENCE/cuda/status.txt" "$EVIDENCE/cuda/run.log" 2>/dev/null || true
          fi
      - name: Terminate pod and confirm
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          CREATED_AT: ${{ steps.pod.outputs.created_at }}
        run: python3 -I tools/ci/runpod.py terminate --name "$POD_NAME" --created-at "$CREATED_AT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qualification-cuda
          path: artifacts/qualification/cuda/
          if-no-files-found: warn
      - name: Result
        run: |
          rc="$(cat "$EVIDENCE/cuda/exit-code" 2>/dev/null || echo missing)"
          echo "pod run exit code: $rc"
          [[ "$rc" == 0 ]]
