name: Model request
description: Ask for a model to be admitted (plan section 7).
labels: [model-request]
body:
  - type: input
    id: model
    attributes:
      label: Model
      description: Hub ID or upstream URL, with a revision if you have one.
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What would you build with it?
      description: Concrete use cases count toward the user-demand score.
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: Code and weight licenses
      description: Lack of access or redistribution rights is a hard blocker.
  - type: dropdown
    id: route
    attributes:
      label: Likely execution route
      options: [Unknown, ONNX Runtime, ONNX Runtime GenAI, llama.cpp binding, TorchSharp, Managed .NET]
  - type: textarea
    id: hardware
    attributes:
      label: Target hardware
