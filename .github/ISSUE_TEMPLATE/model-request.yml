name: Model request
description: Ask for a model to be added to Starling.
title: "Model request: "
labels: [model-request]
body:
  - type: input
    id: model
    attributes:
      label: Model link
      description: Hugging Face or upstream URL.
      placeholder: https://huggingface.co/org/model
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: Use cases (optional)
      description: What would you build with it?
    validations:
      required: false
