# BERT route (Starlings.Models.Bert): sentence-transformers/all-MiniLM-L6-v2 on ONNX Runtime 1.30.0, fp32 on the CPU provider. Candidate
# contract: model-pipeline/candidates/minilm/profile.json (onboarding route bert-onnx-cpu-v1,
# recipes/minilm-cpu.yaml), admitted to the route in the initial five-model onboarding (FIVE_MODELS.md); BertModelProfile.BuiltIn("minilm") embeds the same
# file. Registry manifest added at Experimental in the ai-dotnet 0.4.0 release candidate at the maintainer's request, so
# the package README states its maturity. No admission record exists for the BERT route; the references are proposed,
# not adopted into protected/, and no gate has run.
schema_version: 1
id: all-minilm-l6-v2/onnx-fp32-cpu
# Experimental: development parity on the onboarding route only (proposed references, predeclared candidate policy); no gate ran.
maturity: experimental

origin:
  code:
    # No separate inference code is pinned: the C# package reimplements the pipeline (tokenization, pooling,
    # normalization) from this repository's configuration at the same commit.
    url: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2
    revision: "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
  weights:
    url: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2
    revision: "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
  files:
    # sentence-transformers/all-MiniLM-L6-v2 at the pinned commit (candidates/minilm/profile.json, origin.files), verified on download.
    - path: 1_Pooling/config.json
      sha256: "4be450dde3b0273bb9787637cfbd28fe04a7ba6ab9d36ac48e92b11e350ffc23"
      size: 190
