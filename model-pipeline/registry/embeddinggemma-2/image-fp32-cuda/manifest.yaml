# EmbeddingGemma 2 image-embedding profile on the CUDA execution provider (use_tf32 0), same graphs and
# reference as image-fp32-cpu;: contract extended to images by Mark on 2026-10-11
# (model-pipeline/admissions/embeddinggemma-2.md, Decision update): image-only and interleaved text-and-image embeddings,
# default 280-token vision budget, Experimental. Spike: docs/m0/embeddinggemma2-image-spike.md. Package:
# ai-dotnet/src/Starlings.Models.EmbeddingGemma2 (EmbeddingGemma2MultimodalEmbedder; EmbeddingGemma2ModelAssets.ImageLock
# pins the files below) and the decoding adapter Starlings.Models.EmbeddingGemma2.Imaging.SkiaSharp. The Hub
# repository ships no ONNX file: the three graphs are Starling's reproducible exports (execution.graph). Accepted
# fixtures (PR #42) and binding tolerances set on 2026-10-11 (qualification).
