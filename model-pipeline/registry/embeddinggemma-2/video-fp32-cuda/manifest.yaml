# EmbeddingGemma 2 video-embedding profile (CUDA execution provider, use_tf32 0, same graphs and reference as video-fp32-cpu): contract extended to video by Mark on 2026-10-11
# (model-pipeline/admissions/embeddinggemma-2.md, Decision update, video): video-only and interleaved text/image/video
# embeddings at the checkpoint's settings (1 fps, at most 32 frames, 140 soft tokens per frame, no timestamps),
# Experimental. Spike: docs/m0/embeddinggemma2-video-spike.md. Package: ai-dotnet/src/Starlings.Models.EmbeddingGemma2
# (EmbeddingGemma2MultimodalEmbedder, EmbeddingGemma2Video; EmbeddingGemma2ModelAssets.ImageLock pins the files below: no
# new graph) and the optional decoding adapter Starlings.Models.EmbeddingGemma2.Video.FFmpeg (user-supplied
# FFmpeg 8.x; none shipped). Accepted fixtures (PR #47) and binding tolerances set on 2026-10-11 (qualification).
