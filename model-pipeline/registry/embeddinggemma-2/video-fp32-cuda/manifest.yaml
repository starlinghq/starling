  notes: >-
    As embeddinggemma-2/image-fp32-cpu (same graphs, same release embeddinggemma-2-vision-onnx-r1). Video decoding is
    optional and separate: one adapter package per FFmpeg major (Starlings.Models.EmbeddingGemma2.Video.FFmpeg for 8.x,
    Starlings.Models.EmbeddingGemma2.Video.FFmpeg9 for 9.x), each binding FFmpeg through its own bindings generated from
    that major's headers (tools/generate-ffmpeg-bindings.py; no third-party bindings package) and loading the user's own
    FFmpeg shared libraries at run time; Starling ships no FFmpeg binary, so the LGPL
    obligations of FFmpeg fall on whoever distributes FFmpeg (an LGPL build is expected; GPL and nonfree builds are
