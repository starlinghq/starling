    license, attribution, the list of modifications and the card's Gemma Prohibited Use Policy sentence in the asset
    notice (model-pipeline/reference/embeddinggemma2/NOTICE-embeddinggemma2-onnx.txt) and the package README.
    tokenizer.json and config_sentence_transformers.json are fetched from the Hub at the pinned revision, not bundled.

behavior:
  tasks: [embedding]
  # The card's validated context window. sentence-transformers sets no max_seq_length and would run longer input
  # silently; decision 2026-10-10: the C# package rejects inputs above 8,192 tokens (special tokens and prompt included)
  # with EmbeddingGemma2InputTooLongException. Inputs of 2,050 to 8,192 tokens: proposed long-input rows (capability closure 2026-10-14).
  max_input_tokens: 8192
  offsets_unit: none
  truncation: error
  defaults:
    pooling: mean over attention mask, prompt tokens included (1_Pooling include_prompt true)
    normalize: l2
    dimension: 768
    matryoshka_dimensions: [768, 512, 256, 128]
    matryoshka: >-
      keep the leading dimensions and L2-normalize again (sentence-transformers truncate_dim with normalize_embeddings);
      any other size is rejected.
    input_prefix: >-
      Prompts are explicit: the caller chooses one of the 20 names in config_sentence_transformers.json (query =
      "task: search result | query: ", document = "title: none | text: ") or none. default_prompt_name is null; the
      package never inserts a prompt. The prompt text is prepended to the text before tokenization.
    pad_token_id: 0
  unsupported:
    - image, audio and video embeddings (vision and audio towers are not in the graph)
    - media placeholder and boundary tokens in text (<|image|>, <|audio|>, <|video|>, <|image>, <image|>, <|audio>, <audio|>; rejected)
    - inputs above 8,192 tokens (rejected, not truncated)
    - truncation of any kind
    - pair encoding as an embedding input
    - bfloat16, float16 and quantized variants (the card says never float16)
    - TF32 math (ORT CUDA EP use_tf32 1, the ORT default)
    - Matryoshka sizes other than 768, 512, 256, 128

processing:
  # Owned profile gemma-bpe-embeddinggemma2 (profiles/gemma-bpe-embeddinggemma2.yaml in starlinghq/tokenizers): the 49 accepted
  # fixture cases exact, 0 differential mismatches. EmbeddingGemma2Tokenizer adds <bos>/<eos> and never truncates.
  tokenizer:
    # 0.3.0-preview.1 is the published tokenizer (starlinghq/tokenizers): the qualified 0.1.0-preview.4 behavior plus BERT WordPiece components this profile does not use; every conformance fixture passes unchanged.
    package: Starlings.Tokenizers
    version: 0.3.0-preview.1
    profile_id: gemma-bpe-embeddinggemma2
    algorithm: bpe
    assets:
      - path: tokenizer.json
        sha256: "4d777ef5bdc1aa36227abdfb77c3e49e7b9c892d16e1b6bda41c393504828be4"
        size: 32170510
    backend_tokenizer_dependency: false
  decoding:
    reference_tokenizer: >-
      The pinned tokenizer.json as read by tokenizers 0.23.3 (SentencePiece-style BPE with byte fallback, <bos> $A <eos>).
      transformers 5.19.0 GemmaTokenizer equals it field by field; sentence-transformers 6.1.0 chat-template
      preprocessing gives the ids of tokenizer.json on prompt + text (tokenizer-implementations.json).

execution:
  backend:
    name: onnxruntime
    version: 1.30.0
    binding: Microsoft.ML.OnnxRuntime.Gpu.Linux
    binding_version: 1.30.0
  precision: fp32
  variant: reference
  graph:
    # Text path of EmbeddingGemma2TextModel (eg2_text.TextPath), torch.onnx dynamo exporter (torch 2.14.1,
    # transformers 5.19.0, requirements.txt), opset 20, then the release step that strips the exporter's run-dependent
    # metadata and inlines the weights (one file, below the 2 GiB protobuf limit). Two independent exports gave the same
    # digest (2026-10-10).
    asset:
      path: onnx/embeddinggemma2-text-fp32.onnx
      sha256: "02cc7ecccbfcb29d812eb104e4c6ea6c599bc87e94f01082606f6a11f0252d11"
      size: 1084327317
      # Public Hugging Face repository since 2026-10-14 (EmbeddingGemma2ModelAssets.ModelSourceIsPlaceholder = false).
      source: https://huggingface.co/Starlinghq/embeddinggemma-2-onnx/resolve/92a02ae2887a91180e611776dd9c286dc5fa35da/embeddinggemma2-text-fp32.onnx
      source_status: public
      notice: model-pipeline/reference/embeddinggemma2/NOTICE-embeddinggemma2-onnx.txt
      produced_by:
        - model-pipeline/reference/embeddinggemma2/export_embeddinggemma2_onnx.py --exporters dynamo
        - model-pipeline/reference/embeddinggemma2/release_embeddinggemma2_onnx.py
    opset: 20
    inputs:
      - { name: input_ids, type: int64, shape: [batch, sequence] }
      - { name: attention_mask, type: int64, shape: [batch, sequence] }
    outputs:
      - { name: last_hidden_state, type: float32, shape: [batch, sequence, 512] }
      - { name: token_embeddings, type: float32, shape: [batch, sequence, 768] }
  # CUDAExecutionProvider options. use_tf32 must be 0 (ORT 1.30.0 defaults it to 1; TF32 moves the embedding by up to
  # 1.9e-4 and fails the bound); Starlings.Runtime.Onnx always sets it. ORT places about 130 shape-arithmetic
  # nodes (Concat, Slice, Squeeze) on CPUExecutionProvider by design; about 2,423 nodes run on CUDA.
  provider_options:
    use_tf32: 0

capabilities:
  # Starlings.Models.EmbeddingGemma2; per-capability evidence in ai-dotnet/README.md. Experimental means tested
  # from fixture ids against the protected development fixtures with the protected tolerances.
  batch: experimental
  streaming: unsupported
  cancellation: experimental
  persistence: unsupported
  training: unsupported
  # Capability closure 2026-10-14 (docs/evidence/capability-closure-2026-10-14/README.md):
  # aot: Native AOT publish on Linux x64 against Microsoft.ML.OnnxRuntime.Gpu.Linux 1.30.0, no trim/AOT warnings, typed
  # text API and Extensions.AI generator on CUDA equal to JIT on CUDA bit for bit (tools/aot-check-ai.sh --cuda).
  # The ML.NET adapter does not run under Native AOT (Microsoft.ML uses Reflection.Emit).
  aot: experimental
  # extensions_ai and mlnet: EmbeddingGemma2.Tests.Cuda CudaAdapterTests, the generator (prompts none, query, document)
  # and the transform over a CUDA session, within this profile's protected tolerances (max abs 4.3e-7 and 3.3e-7).
  extensions_ai: experimental
  mlnet: experimental
  embedding_pretokenized: experimental
  embedding_text: experimental
  tokenizer_owned: experimental
  prompts_query_document: experimental
  # prompts_task (capability closure 2026-10-14, docs/evidence/capability-closure-2026-10-14/README.md): all 20 prompt names on four public texts
  # (proposed task-prompt rows from sentence-transformers): ids exact, embedding max abs 2.8e-7 (CudaParityTests.TaskPromptParityWithTheOwnedTokenizer).
  # Proposed rows, protected bounds.
  prompts_task: experimental
  matryoshka: experimental
  input_up_to_2049_tokens: experimental
  # input_2050_to_8192_tokens (capability closure 2026-10-14): the CUDA run in docs/evidence/capability-closure-2026-10-14/eg2-long-input-cuda/: 8 text rows of 2,600 to 8,192 tokens, embedding max abs 2.0e-7, ids exact, rejections over 8,192
  # exact, within the protected text bound. Proposed rows (not accepted), protected bounds.
  input_2050_to_8192_tokens: experimental
  input_over_8192_tokens: unsupported
  concurrent_calls: experimental
  image: unsupported
  audio: unsupported
  video: unsupported

compatibility:
  # One RTX 4060 Ti (sm_89), CUDA 13 runtime and cuDNN 9 from the nvidia-* wheels, shared with another process.
  # One machine is not qualification.
  - os: linux
    arch: x64
    provider: cuda
    status: experimental
    verified: 2026-10-10
  - os: windows
    arch: x64
    provider: cuda
    status: untested

qualification:
  reference_runner: model-pipeline/reference/embeddinggemma2/run_embeddinggemma2.py
  # The reference is shared with onnx-fp32-cpu (same graph, same PyTorch fp32 CPU embeddings). Binding tolerances set
  # 2026-10-10, valid only with use_tf32 0.
  fixtures: model-pipeline/protected/embeddinggemma-2/onnx-fp32-cpu
  tolerances: model-pipeline/protected/embeddinggemma-2/onnx-fp32-cuda/tolerances.yaml
  # CUDA G1/G2, 2026-10-14 (RTX 3090, use_tf32 0): the protected staged evaluator gave G1 passed, G2 passed on the accepted
  # development fixtures, which are not P-030 release sets, so the entries are checklist, not passed (docs/evidence/cuda-qualification-2026-10-14/).
  gates:
    G0: { status: checklist, evidence: docs/m0/hub-pins.md, date: 2026-10-10 }
    G1: { status: checklist, evidence: docs/evidence/cuda-qualification-2026-10-14/embeddinggemma2-onnx-fp32-cuda/README.md, date: 2026-10-14 }
    G2: { status: checklist, evidence: docs/evidence/cuda-qualification-2026-10-14/embeddinggemma2-onnx-fp32-cuda/README.md, date: 2026-10-14 }
    G3: { status: not-run }
    G4: { status: not-run }
    G5: { status: not-run }
    G6: { status: not-run }
    G7: { status: not-run }

maintenance:
  owner: Mark
  latest_known_upstream_revision: "914f7f89142e33e77833254d9c9b90c3cef7303b"
  latest_verified_upstream_revision: "914f7f89142e33e77833254d9c9b90c3cef7303b"
  last_checked: 2026-10-10
  review_date: 2027-01-05
  known_issues:
    - >-
      Evaluator run 2026-10-11 (docs/evidence/embeddinggemma2-dotnet/, CPU): G1 passed; G2 failed only on
      export.token_embeddings (Python ORT vs PyTorch): the tolerance file's |d| <= 1e-4 * max(1, |ref|) judged per value
      gives 1.7e-2, while the per-case max |d| / max(1, max |ref|) the bound was set from is 6.2e-6. Which reading binds
      is a maintainer decision; every .NET check passed.
    - >-
      The hosted graph is public since 2026-10-14. The 0.1.0-preview.6 release drill downloaded it with no token into an
      empty cache, verified it and ran the sample offline (Linux x64, one machine); other platforms are untested.
    - >-
      Accepted fixtures reach 1,750 tokens and batch-independence checks 2,049; 2,050 to 8,192 tokens is covered by the
      proposed long-input rows (not yet accepted).
      Long rows need GPU memory that grows with the square of the length in the full-attention layers.
    - >-
      Native runtime: Microsoft.ML.OnnxRuntime.Gpu.Linux 1.30.0 needs the CUDA 13 runtime and cuDNN 9 on the loader path;
      the package does not ship them.
    - >-
      The accepted fixtures cover the none, query and document prompts only; the other 18 names are covered by the
      proposed task-prompt rows (model-pipeline/proposed/embeddinggemma-2/task-prompts, not yet accepted). Matryoshka sizes are checked against the reference sliced and renormalized (the fixtures hold no
      truncated rows; the spike probe showed sentence-transformers truncate_dim equals that within 6e-8).
