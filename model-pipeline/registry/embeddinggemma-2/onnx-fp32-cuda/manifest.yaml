# EmbeddingGemma 2 text-embedding profile on the CUDA execution provider (use_tf32 0), same graph and reference as
# onnx-fp32-cpu. CUDA parity evidence: model-pipeline/protected/embeddinggemma-2/onnx-fp32-cuda/ (accepted, PR #29).
# Profile basis: admission (model-pipeline/admissions/embeddinggemma-2.md, admitted 2026-10-10
# at maturity Experimental, text embeddings only), spike (docs/m0/embeddinggemma2-spike.md) and the C# package
# ai-dotnet/src/Starlings.Models.EmbeddingGemma2 (EmbeddingGemma2ModelAssets.Lock pins the graph, tokenizer.json
# and config_sentence_transformers.json below). The Hub repository ships no ONNX file: the graph is Starling's
# reproducible export of the text path (execution.graph), listed in origin.files with its digest. Development fixtures
# accepted (PR #29) and binding tolerances set on 2026-10-10.
