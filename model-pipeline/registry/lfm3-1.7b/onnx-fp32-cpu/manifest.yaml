# LFM3 text generation (Starlings.Models.Lfm3, #217): LiquidAI/LFM3-1.7B through Liquid's own fp32 ONNX export
# (LiquidAI/LFM3-1.7B-ONNX) on ONNX Runtime 1.30.0, CPU provider, with an owned greedy decode loop over the step graph.
# Admission: model-pipeline/admissions/lfm3.md (Experimental, 2026-10-30). Candidate contract:
# model-pipeline/candidates/lfm3-1.7b/profile.json. Development evidence: docs/evidence/lfm3-onboarding-2026-10-28/
# (template, prompt ids, greedy ids and step-0 logits equal to Python ONNX Runtime on 19 cases). No PyTorch reference
# run, nothing adopted into protected/, no gate.
schema_version: 1
id: lfm3-1.7b/onnx-fp32-cpu
# Experimental: same-graph development parity only; no gate ran.
maturity: experimental

