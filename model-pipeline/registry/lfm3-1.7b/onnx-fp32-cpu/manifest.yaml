behavior:
  tasks: [generation]
  # Lfm3Options.ContextLength (default 32,768; at most the checkpoint's 262,144 positions). Prompt plus max_new_tokens
  # above it raise GenerationContextLengthException before the graph runs. The evidence covers prompts up to 368 tokens.
  max_input_tokens: 32768
  offsets_unit: none
  truncation: error
  defaults:
    decoding: greedy (first maximum of the logits; logits_to_keep 1)
    max_new_tokens: 512                # GenerationOptions default
    stop_token_ids: [124900]           # <|im_end|>; never part of the completion or the usage count
    enable_thinking: true              # the template's default; Lfm3ChatModel.Chat takes enableThinking
    template: "lfm3-text-v1: text system, user and assistant turns, enable_thinking and preserve_thinking"
    request_state: one Lfm3Sequence (convolution and attention caches) per request; requests share the weights only.
  unsupported:
    - sampling, including the card's temperature 0.1, top_k 50, repetition_penalty 1.1
    - logprobs and guided decoding
    - tools, tool calls and tool turns; deferred tools
    - image, video and audio input
    - prefix or conversation state reuse across requests
    - batching several prompts in one call
    - the quantized and fp16 graphs on this profile; CUDA (untested)

processing:
  tokenizer:
    package: Starlings.Tokenizers
    # The repository pin (every manifest names it; the release drills check). 0.3.2 rejects the LFM3 split regex: the
    # pin and this line move to 0.3.3, the first version with lfm3-bpe-chat, before any release ships this package.
    version: 0.3.2
    # The export's tokenizer.json (the checkpoint's file without its final newline: the same JSON) through the
    # lfm3-bpe-chat profile (byte-level BPE, Llama 3 split regex, ignore_merges).
    profile_id: lfm3-bpe-chat
    algorithm: byte-level-bpe
    assets:
      - path: tokenizer.json
        sha256: "41927bd314d17d7d7fadb44e10cd0919f7b71528d7741596d8cbd15c6945ec44"
        size: 17908634
    backend_tokenizer_dependency: false
  template:
    asset:
      path: chat_template.jinja
      sha256: "f45005c50cd2a97329722bf3a2dee9f16c04cdf825a589b280fb7e99e6827818"
      size: 12129
    # C# port (Lfm3ChatTemplate); equal to transformers 5.21.0 apply_chat_template on 19 corpus conversations.
    renderer: owned
  decoding:
    loop: Starlings.Models.Lfm3 Lfm3ChatModel over Lfm3Sequence (one step graph for prefill and decode)
    detokenization: incremental through the owned ByteLevel decoder; text is held back until a UTF-8 sequence completes
    token_selection: greedy argmax in managed code

execution:
  backend:
    name: onnxruntime
    version: 1.30.0
    binding: Microsoft.ML.OnnxRuntime
  precision: fp32
  variant: reference
  graph:
    inputs:
      - { name: input_ids, type: int64, shape: [batch_size, sequence_length] }
      - { name: attention_mask, type: int64, shape: [batch_size, total_sequence_length] }
      - { name: position_ids, type: int64, shape: [batch_size, sequence_length] }
      - { name: logits_to_keep, type: int64, shape: [1] }
      - { name: "past_conv.N (13 convolution layers)", type: float32, shape: [batch_size, 2048, 7] }
      - { name: "past_key_values.N.key and .value (11 attention layers)", type: float32, shape: [batch_size, 4, past_sequence_length, 128] }
    outputs:
      - { name: logits, type: float32, shape: [batch_size, num_logits, 128000] }
      - { name: "present_conv.N, present.N.key and .value", type: float32, shape: as the past inputs, with total_sequence_length }

capabilities:
  # Starlings.Models.Lfm3 (Lfm3Capabilities.All, same statuses; ai-dotnet/tests/Starlings.Models.Lfm3.Tests
  # RegistryContractTests keeps them equal; a package key's "." is "_" here).
  generation_greedy: experimental
  generation_fp16: untested
  generation_cuda: untested
  chat_template_text: experimental
  chat_template_thinking_switch: experimental
  streaming: experimental
  stop_sequences: experimental
  prefill_chunking: experimental
  cancellation: experimental
  concurrent_calls: untested
  asset_acquisition: experimental
  long_context: untested
  sampling: unsupported
  logprobs: unsupported
  guided_decoding: unsupported
  tool_calling: unsupported
  reasoning_parsing: unsupported
  vision: unsupported
  audio: unsupported
  prefix_reuse: unsupported
  batch: unsupported
  quantized: unsupported
  extensions_ai: unsupported
  mlnet: unsupported
  persistence: unsupported
  training: unsupported
  aot: untested

