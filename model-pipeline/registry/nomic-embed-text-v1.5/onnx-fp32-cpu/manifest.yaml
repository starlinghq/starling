# BERT route (Starlings.Models.Bert): nomic-ai/nomic-embed-text-v1.5 on ONNX Runtime 1.30.0, fp32 on the CPU provider. Candidate
# contract: model-pipeline/candidates/nomic-embed/profile.json (onboarding route bert-onnx-cpu-v1,
# recipes/nomic-embed-cpu.yaml), admitted to the route in #120; BertModelProfile.BuiltIn("nomic-embed") embeds the same
# file. Registry manifest added at Experimental in the ai-dotnet 0.4.0 release candidate at the maintainer's request, so
# the package README states its maturity. No admission record exists for the BERT route; the references are proposed,
# not adopted into protected/, and no gate has run.
schema_version: 1
id: nomic-embed-text-v1.5/onnx-fp32-cpu
# Experimental: development parity on the onboarding route only (proposed references, predeclared candidate policy); no gate ran.
maturity: experimental

origin:
  code:
    # No separate inference code is pinned: the C# package reimplements the pipeline (tokenization, pooling,
    # normalization) from this repository's configuration at the same commit.
    url: https://huggingface.co/nomic-ai/nomic-embed-text-v1.5
    revision: "e9b6763023c676ca8431644204f50c2b100d9aab"
  weights:
    url: https://huggingface.co/nomic-ai/nomic-embed-text-v1.5
    revision: "e9b6763023c676ca8431644204f50c2b100d9aab"
  files:
    # nomic-ai/nomic-embed-text-v1.5 at the pinned commit (candidates/nomic-embed/profile.json, origin.files), verified on download.
    - path: 1_Pooling/config.json
      sha256: "3d6180f7233df2f529d65ea60c8db4af614fb78cbe99fd81103dcfeb9f8166a5"
      size: 286
