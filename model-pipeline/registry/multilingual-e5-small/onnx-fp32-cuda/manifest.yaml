    multilingual-e5-small by Liang Wang, Nan Yang, Xiaolong Huang, Linjun Yang, Rangan Majumder and
    Furu Wei (Microsoft), "Multilingual E5 Text Embeddings: A Technical Report", arXiv:2402.05672.
    Tokenizer vocabulary from XLM-RoBERTa (Conneau et al.).

rights:
  code_license: MIT
  weights_license: MIT
  tokenizer_terms: MIT
  redistribution: download
  notes: >-
    MIT is stated only in the model card front matter (README.md at the pinned revision, line 97);
    the repository has no LICENSE file. The tokenizer assets ship in the same repository under the
    same card. Weights are fetched from the Hub at the pinned revision, not bundled: the C# package
    ships the lock (E5ModelAssets.Lock: onnx/model.onnx and tokenizer.json with the digests above) and
    Starlings.Acquisition downloads and verifies it explicitly (P-009).

behavior:
  tasks: [embedding]
  max_input_tokens: 512
  offsets_unit: none
  truncation: truncate-right
  defaults:
    pooling: mean over attention mask
    normalize: l2
    dimension: 384
    input_prefix: >-
      Callers add "query: " or "passage: " themselves (model card). The profile does not insert
      prefixes.
  unsupported:
    - pair encoding as an embedding input (the tokenizer supports pairs; the embedding task does not use them)
    - token_type_ids other than 0
    - quantized ONNX variants (onnx/model_O4.onnx, onnx/model_qint8_avx512_vnni.onnx) in this profile
    - OpenVINO files
    - TF32 math (ORT CUDA EP use_tf32=1, the ORT default); it moves hidden states by up to 1.5e-3 and is a separate candidate
    - fp16 graphs or autocast in this profile (separate candidate, see docs/m0/e5-gpu.md)
    - TensorRT execution provider (not tested)

processing:
  # Tokenizer 0.1.0-preview.3 (2026-10-10) added the Qwen byte-level BPE components and 0.1.0-preview.4 (2026-10-10) the
  # Gemma BPE components (byte fallback, unknown token, String Split, Sequence/Replace/ByteFallback/Fuse decoders); the
  # Unigram path is unchanged in behavior and passes every tokenizer fixture of this profile again (tokenizer test suite).
  # Model gates were not rerun.
  tokenizer:
    # 0.3.0-preview.1 is the published tokenizer (starlinghq/tokenizers): the qualified 0.1.0-preview.4 behavior plus BERT WordPiece components this profile does not use; every conformance fixture passes unchanged.
    package: Starlings.Tokenizers
    version: 0.3.0-preview.1
    profile_id: xlmr-unigram-e5
    algorithm: unigram
    assets:
      - path: tokenizer.json
        sha256: "0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39"
        size: 17082730
    backend_tokenizer_dependency: false
  decoding:
    reference_tokenizer: >-
      The pinned tokenizer.json as read by tokenizers 0.23.2. transformers 5.18.0 XLMRobertaTokenizer
      (used by sentence-transformers 6.1.0) rebuilds a different pipeline and differs on 5 of 46 corpus
      cases; slow SentencePiece differs on 6. See docs/m0/reference-runs.md.

execution:
  backend:
    name: onnxruntime
    version: 1.30.0
    binding: Microsoft.ML.OnnxRuntime.Gpu
    binding_version: 1.30.0
  precision: fp32
  variant: reference
  graph:
    inputs:
      - { name: input_ids, type: int64, shape: [batch_size, sequence_length] }
      - { name: attention_mask, type: int64, shape: [batch_size, sequence_length] }
      - { name: token_type_ids, type: int64, shape: [batch_size, sequence_length] }
    outputs:
      - { name: last_hidden_state, type: float32, shape: [batch_size, sequence_length, 384] }
  # CUDAExecutionProvider options, passed to ORT as given. use_tf32 must be 0: ORT 1.30.0 defaults it to 1.
  # ORT places 2 shape nodes (Gather, Unsqueeze) on CPUExecutionProvider by design; 349 nodes run on CUDA.
  # The schema has no field for the execution provider name or the allowed fallback set.
  provider_options:
    use_tf32: 0

capabilities:
  # batch and cancellation: C# Starlings.Models.E5 (P-005/P-006) on fixture ids with the CUDA EP
  # (Microsoft.ML.OnnxRuntime.Gpu.Linux 1.30.0, use_tf32=0); see ai-dotnet/README.md.
  batch: experimental
  streaming: unsupported
  cancellation: experimental
  persistence: unsupported
  training: unsupported
  aot: untested
  extensions_ai: untested  # the P-011 adapter is provider-agnostic but has not been run over a CUDA session
  mlnet: untested  # the P-012 transform is provider-agnostic but has not been run over a CUDA session

compatibility:
  # Linux x64 CUDA: Python and C# ORT runs on one RTX 4060 Ti (sm_89), driver 610.57.04, CUDA 13.0 runtime,
  # cuDNN 9.24 from the nvidia-* wheels. One machine is not qualification.
  - os: linux
    arch: x64
    provider: cuda
    status: experimental
    verified: 2026-10-08
  - os: windows
    arch: x64
    provider: cuda
    status: untested

qualification:
  reference_runner: model-pipeline/reference/encoder/run_e5_cuda.py
  # The reference is shared with onnx-fp32-cpu (same graph, same PyTorch fp32 CPU embeddings). CUDA parity
  # results are proposed separately in protected/multilingual-e5-small/onnx-fp32-cuda/ (PROPOSED.md there).
  fixtures: model-pipeline/protected/multilingual-e5-small/onnx-fp32-cpu
  # Binding tolerances set by Mark on 2026-10-08 (PR #4).
  tolerances: model-pipeline/protected/multilingual-e5-small/onnx-fp32-cuda/tolerances.yaml
  # CUDA G1/G2, 2026-10-14 (RTX 3090, use_tf32 0): the protected staged evaluator gave G1 passed, G2 passed on the accepted
  # development fixtures, which are not P-030 release sets, so the entries are checklist, not passed (docs/evidence/cuda-qualification-2026-10-14/).
  gates:
    G0: { status: checklist, evidence: docs/m0/hub-pins.md, date: 2026-10-05 }
    G1: { status: checklist, evidence: docs/evidence/cuda-qualification-2026-10-14/e5-onnx-fp32-cuda/README.md, date: 2026-10-14 }
    G2: { status: checklist, evidence: docs/evidence/cuda-qualification-2026-10-14/e5-onnx-fp32-cuda/README.md, date: 2026-10-14 }
    G3: { status: not-run }
    G4: { status: not-run }
    G5: { status: not-run }
    G6: { status: not-run }
    G7: { status: not-run }

maintenance:
  owner: Mark
  latest_known_upstream_revision: "614241f622f53c4eeff9890bdc4f31cfecc418b3"
  latest_verified_upstream_revision: "614241f622f53c4eeff9890bdc4f31cfecc418b3"
  last_checked: 2026-10-05
  review_date: 2027-01-05
  known_issues:
    - >-
      The pinned tokenizer.json emits a lone "▁" token before special-token literals and for trailing
      whitespace, where SentencePiece and transformers 5.18 emit none. The owned profile follows
      tokenizer.json; the difference is recorded, not fixed.
    - >-
      tokenizer.json leaves decomposed Hangul jamo uncomposed, while SentencePiece composes them.
    - >-
      Native runtime: Microsoft.ML.OnnxRuntime.Gpu 1.30.0 needs CUDA 13 runtime libraries and cuDNN 9 on the
      loader path; the package does not ship them. The schema has no field for native runtime, driver or GPU
      requirements, so they are recorded here and in docs/m0/e5-gpu.md.
    - >-
      With use_tf32 0, ORT CUDA matches the PyTorch fp32 CPU hidden states to 2.1e-6 and the protected
      embeddings to 1.9e-7 on the M0 corpus; C# and Python ORT CUDA hidden states are bit-identical.
