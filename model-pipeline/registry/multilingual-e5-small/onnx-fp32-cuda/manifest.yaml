# Proposed CUDA execution profile for the P0 encoder (intfloat/multilingual-e5-small), same graph and
# reference as onnx-fp32-cpu. Evidence: docs/m0/e5-gpu.md and the proposed (not accepted) parity results in
# model-pipeline/protected/multilingual-e5-small/onnx-fp32-cuda/. Not reviewed by the maintainer.
schema_version: 1
id: multilingual-e5-small/onnx-fp32-cuda
maturity: experimental

origin:
  # The Hub repository holds both the sentence-transformers configuration and the weights.
  code:
    url: https://huggingface.co/intfloat/multilingual-e5-small
    revision: "614241f622f53c4eeff9890bdc4f31cfecc418b3"
  weights:
