behavior:
  tasks: [decision]
  # Validated context (model card, "Long documents"): states of at most 8,192 tokens, <state> included, and rows (state
  # plus one question's branch) of at most 8,192 tokens (upstream SERVE_MAX_BRANCH_8K). Longer inputs throw
  # KevInputTooLongException; nothing is truncated. Upstream serves up to 65,536 with accuracy loss above 8,192.
  max_input_tokens: 8192
  offsets_unit: none
  truncation: error
  defaults:
    temperature: >-
      2.3510958125672174, the calibration temperature stored in head.pt (KevOptions.Temperature null). 1.0 gives the
      raw probabilities (upstream KEV_TEMPERATURE=1.0).
    question_types: noul (probability of yes), choice (1 to 255 options), score (1 to 255 levels)
    answers: >-
      unrounded probabilities. Choice is the first most likely key; Confidence is System One's (p_max - 1/K) / (1 - 1/K)
      (the score formula for score questions); ExpectedScore is sum(i * p_i).
    request_rendering: >-
      as kev/api.py and kev/model.py at 6b719c3c: JSON states rendered with Python str() of numbers and booleans, each
      segment tokenized alone without special tokens, and any <|name|> in user text rewritten to <¦name¦> so it can
      never become a delimiter.
    question_isolation: >-
      the state runs once; every question then runs as its own causal row continuing from the state's cache, so
      questions cannot influence one another (the cache lives for one request).
    delimiters: >-
      state 248060 <|fim_prefix|>, question 248061 <|fim_middle|>, option 248049 <|box_start|>, option end 248050
      <|box_end|> (the option key), decide 248062 <|fim_suffix|> (the question query), pad 248044 <|endoftext|>.
    pointer_head: >-
      projection width 256; each option's </opt> hidden state scored against the question's <decide>, divided by the
      temperature.
    concurrency: >-
      concurrent Decide calls on one model are independent on CPU (not serialized); four callers matched sequential
      calls bit for bit (ModelParityTests).
  unsupported:
    - states over 8,192 tokens and rows over 8,192 tokens (rejected, not truncated; KEV_TRUNCATE_STATES)
    - state prefix reuse across requests (upstream PrefixCache)
    - batching several requests or rows in one call
    - upstream's 4-decimal probability rounding and usage.output_tokens
    - KEV_DATE_FACTS date preprocessing
    - option isolation mode
    - the HTTP server and its endpoints (/v1/systemone/*, /v1/models, bearer auth)
    - bf16, fp16 and quantized graphs (the builder's -e cuda graphs included)
    - training, fine-tuning and calibration fitting
    - text generation (the graph has no LM head)
    - Kev-9B and Kev-27B

processing:
  tokenizer:
    # The owned tokenizer pinned in ai-dotnet/Directory.Packages.props. Profile qwen2-bpe-kev is the Kev repository's
    # tokenizer.json (the tokenizer Kev builds at runtime: transformers 5.17.0 Qwen2Tokenizer from the base, equal to
    # this file in every field), not the base file base/tokenizer.json (admissions/kev.md, "Tokenizer profile").
    package: Starlings.Tokenizers
    version: 0.3.2
    profile_id: qwen2-bpe-kev
    algorithm: byte-level-bpe
    assets:
      - path: tokenizer.json
        sha256: "06b9509352d2af50381ab2247e083b80d32d5c0aba91c272ca9ff729b6a0e523"
        size: 19989325
    # Token ids come from the owned tokenizer; ONNX Runtime receives ids only.
    backend_tokenizer_dependency: false
  decoding:
    reference: Kev's PyTorch fp32 path (Checkpoint.load on CPU, default LoadOptions) at code 6b719c3c
    readout: hidden_states at each </opt> and <decide> position; the pointer head runs in C# from head.safetensors

execution:
  backend:
    name: onnxruntime
    version: 1.30.0
    binding: Microsoft.ML.OnnxRuntime
  precision: fp32
  variant: reference
  graph:
    # onnxruntime-genai 0.17.1 builder (-p fp32 -e cpu --extra_options exclude_lm_head=true exclude_mtp=true) on the
    # fp32 merge written by model-pipeline/reference/kev/kev_merge.py (config.json set to float32). The export is
    # deterministic; the fp32 LoRA merge is not, so a rebuilt model.onnx.data can differ in a few floats of the
    # LoRA-merged projections (package README, "The bundle"). The lock pins the bundle that was measured.
    assets:
      - path: model.onnx
        sha256: "046aa7b4367dee6c29bd494f330e60c5d2f665540558e26ea02148ecfd7f6278"
        size: 307884
      - path: model.onnx.data
        sha256: "dd78b21c101ef945dc4b7ca31367647da70e4d7fbd3f3d2e05a3245c573dc51a"
        size: 3077177344
    hosting:
      # Download location of every file in the lock (KevModelAssets): <source_base><path>. Public repository since
      # 2026-10-17 (tag r1); the digests, not the address, pin the bytes. The CPU and CUDA profiles share it.
      repository: https://huggingface.co/Starlinghq/kev-0.8b-onnx
      revision: "8a9fe0175d294a89c6fa963a2245eb32e3fa1505"
      source_base: https://huggingface.co/Starlinghq/kev-0.8b-onnx/resolve/8a9fe0175d294a89c6fa963a2245eb32e3fa1505/
      source_status: public
      produced_by:
        - model-pipeline/reference/kev/run_kev.py build (kev_merge.py, then the ONNX Runtime GenAI 0.17.1 builder)
    # Contrib ops (com.microsoft): LinearAttention (gated delta rule), CausalConvWithState, LinearAttentionGate,
    # GatedRMSNorm, GroupQueryAttention, MRotaryEmbedding (admissions/kev.md, "Step 4: export").
    inputs:
      - { name: input_ids, type: int64, shape: [batch, sequence] }
      - { name: attention_mask, type: int64, shape: [batch, total_sequence] }
      - { name: position_ids, type: int64, shape: [3, batch, sequence] }
      - { name: "past_key_values.%d.key/value", type: kv-cache, shape: "6 full-attention layers (3, 7, ..., 23)" }
      - { name: "past.%d.conv/recurrent", type: recurrent-state, shape: "18 Gated DeltaNet layers" }
    outputs:
      - { name: hidden_states, type: float32, shape: [batch, sequence, 1024] }
      - { name: "present.%d.*", type: cache, shape: "the matching state after the input" }

capabilities:
  # Starlings.Models.Kev (KevCapabilities); evidence in the package README ("Evidence"). Statuses follow
  # KevCapabilities.All for the CPU provider: experimental where the C# package was compared with Kev's PyTorch fp32
  # path on the proposed corpus and fixtures (no adopted reference, no gate), unsupported where the package refuses or
  # does not offer it, untested where no evidence exists. KevCapabilities.Profiles holds the same statuses (tested key
  # for key).
  batch: unsupported  # one request per call; rows are not batched
  streaming: unsupported  # one probability vector per question, nothing to stream
  cancellation: experimental
  persistence: unsupported  # the state cache lives for one request
  training: unsupported
  aot: untested
  extensions_ai: unsupported
  mlnet: unsupported
  decision_noul: experimental
  decision_choice: experimental
  decision_score: experimental
  calibrated_temperature: experimental
  raw_probabilities: experimental
  delimiter_escaping: experimental
  question_isolation: experimental
  state_cache_within_request: experimental
  state_json_rendering: experimental
  # Four callers on one model, every request golden twice each, bit-identical to sequential calls (ModelParityTests).
  concurrent_calls: experimental
  asset_verification_offline: experimental
  state_over_8192_tokens: unsupported  # refused, never truncated
  # KevModelAssets.DownloadAsync from the public hosting repository; anonymous download and offline reuse tested
  # (HostingDownloadTests, STARLING_NETWORK_TESTS=1). No G6 drill yet.
  asset_acquisition_download: experimental
  state_prefix_reuse_across_requests: unsupported
  probability_rounding: unsupported
  usage_output_tokens: unsupported
  date_facts: unsupported
  option_isolation: unsupported
  http_server: unsupported
  bf16: unsupported
  fp16: unsupported
  quantized: unsupported
  calibration_fitting: unsupported
  generation: unsupported
  non_english: unsupported

compatibility:
  # Linux deployment requirement: start the process with MALLOC_MMAP_THRESHOLD_=65536 (package README). Without it a
  # one-hour Kev-0.8B CUDA soak's loaded memory grew 64 MB/h (glibc arena retention, outputs correct); with it every
  # Kev soak plateaued (docs/evidence/kev-soak-2026-10-17/).
  # Linux x64 CPU: development evidence 2026-10-16 (package README, "Evidence"): onboarding route kev-onnx-cpu-v1 on
  # the Starling-written corpus and the C# tests with the bundle. No gate.
  - os: linux
    arch: x64
    provider: cpu
    status: experimental
    verified: 2026-10-16
  # CUDA is the separate profile kev-0.8b/onnx-fp32-cuda (same bundle, use_tf32 0); this row mirrors its status.
  - os: linux
    arch: x64
    provider: cuda
    status: experimental
    verified: 2026-10-17
  - os: windows
    arch: x64
    provider: cpu
    status: untested

qualification:
  reference_runner: model-pipeline/reference/kev/run_kev.py
  # No protected fixtures exist for Kev. The reference is proposed, not adopted into protected/: Kev's PyTorch fp32
  # path on the Starling-written corpus below (30 records, 58 questions, 44 labelled; states up to 1,531 tokens) and
  # upstream's development partitions, run through the onboarding route kev-onnx-cpu-v1 (recipes/kev-0.8b-cpu.yaml).
  fixtures: model-pipeline/reference/corpus/kev-decisions-v1.jsonl
  # Binding tolerances set by Mark on 2026-10-08 (PR #4): ONNX Runtime fp32 (CPU EP, or CUDA EP with use_tf32=0)
  # against CPU PyTorch fp32 at Kev code 6b719c3c, weights 9a45d25e. Development evidence (2026-10-16): Python ORT vs
  # PyTorch 2.95e-5 and .NET vs PyTorch 2.96e-5 (2e-4), cached vs uncached 2.7e-7 (1e-5), .NET vs Python ORT 1.24e-7
  # (1e-6), no argmax flip, identical accuracy and token ids. Measured on a proposed reference: no gate.
  tolerances: model-pipeline/protected/kev-0.8b/onnx-fp32/tolerances.yaml
  gates:
    G0: { status: not-run }
    G1: { status: not-run }
    G2: { status: not-run }
    G3: { status: not-run }
    G4: { status: not-run }
    G5: { status: not-run }
    G6: { status: not-run }
    G7: { status: not-run }

maintenance:
  owner: Mark
  # main at the check date is the card-only commit bf75a6a8 (also the Hub tag v1.0), with byte-identical weight, head
  # and tokenizer files (docs/m0/hub-pins.md, checked 2026-10-05).
  latest_known_upstream_revision: "bf75a6a8848ea6960ff2ed108d9ed44c2941174f"
  latest_verified_upstream_revision: "9a45d25eb2ab761841196625383fa1dff0e56c1e"
  last_checked: 2026-10-05
  review_date: 2027-01-05
  known_issues:
    - >-
      model.onnx.data is not byte-reproducible across builds: the fp32 LoRA merge differs in a few floats of the
      LoRA-merged projections between runs (reduction order). The lock pins the measured bundle; a rebuilt bundle needs
      its own digests and its own evidence (KevDecisionModel.Create with explicit paths).
    - >-
      The references are proposed, not adopted into protected/, and no gate has run; every capability is at most
      experimental.
    - >-
      Most of the error against PyTorch comes from ONNX Runtime's CPU LinearAttention kernel (admissions/kev.md, GPU
      results); the bound is 2e-4 in probability.
    - >-
      Upstream lists Kev-0.8B weaknesses that carry over: below-chance When2Call tool routing, date arithmetic and
      knowledge questions.
    - >-
      Memory: about 3.5 GB resident, plus the state cache.
