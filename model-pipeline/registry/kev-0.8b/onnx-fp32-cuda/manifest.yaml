# Kev decision model (P-027): jaredpalmer/kev-0.8b (Kev 1.0, a LoRA adapter and pointer head on
# Qwen/Qwen3.5-0.8B-Base) on ONNX Runtime 1.30.0, CUDA provider with use_tf32 0, through
# ai-dotnet/src/Starlings.Models.Kev.Onnx (KevModelProfile.Kev08B.CudaId). Same bundle, lock and reference as
# kev-0.8b/onnx-fp32-cpu: the builder's CPU export run on the CUDA execution provider. The builder's own CUDA graph
# (-e cuda -p fp32) did not load unpatched with ONNX Runtime GenAI 0.17.1 (admissions/kev.md, "GPU results") and is not
# this profile. (KevModelAssets.Kev08BLock pins the bundle files; KevModelProfile.Kev08B the revisions and dimensions.)
# Admission: model-pipeline/admissions/kev.md (admitted at Experimental, Mark, 2026-10-08, PR #4). Candidate contract:
# model-pipeline/candidates/kev-0.8b/profile.json (onboarding route kev-onnx-cpu-v1). No Hub repository ships an fp32
# ONNX graph of Kev 1.0: the bundle is Starling's build from the pinned sources (route A: kev_merge.py fp32 LoRA merge,
# then the ONNX Runtime GenAI 0.17.1 builder -p fp32 -e cpu --extra_options exclude_lm_head=true exclude_mtp=true),
# listed in origin.files with its digests. The bundle is hosted publicly (Starlinghq/kev-0.8b-onnx, r1), references are proposed (not adopted into
# protected/), and no gate has run.
