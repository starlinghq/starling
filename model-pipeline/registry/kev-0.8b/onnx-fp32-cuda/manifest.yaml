id: kev-0.8b/onnx-fp32-cuda
# Experimental (package README, "CUDA"): local development evidence on one RTX 3090 only, no per-release GPU
# regression, no gate ran, the bundle is hosted publicly (Starlinghq/kev-0.8b-onnx, r1).
maturity: experimental

