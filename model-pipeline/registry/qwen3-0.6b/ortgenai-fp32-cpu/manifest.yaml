  backend:
    name: onnxruntime-genai
    version: 0.17.1
    binding: Microsoft.ML.OnnxRuntimeGenAI
    binding_version: 0.17.1
  precision: fp32
  variant: reference
  graph:
    # build_bundle.py: onnxruntime-genai 0.17.1 builder -p fp32 -e cpu on the verified original. Two builds on
    # 2026-10-18 gave the same digests. Hosted (graph.hosting); building locally gives the same bytes.
    assets:
