capabilities:
  # Starlings.Models.QwenChat; evidence: docs/evidence/qwenchat-onboarding-2026-10-18/README.md. Experimental where the
  # onboarding route compared the C# package with transformers and Python GenAI on the proposed corpus (no adopted
  # reference, no gate); unsupported where the package refuses or does not offer it; untested where no evidence exists.
  batch: unsupported
  streaming: experimental  # streamed text and ids equal the non-streamed result on every corpus row
  cancellation: experimental  # before the prefill and between decode steps, every row
  persistence: unsupported
  training: unsupported
  aot: untested
  extensions_ai: unsupported
  mlnet: unsupported
  greedy_generation: experimental
  sampling_seeded: unsupported
  stop_tokens: experimental
  stop_sequences: experimental
  max_new_tokens: experimental
  usage: experimental
  step0_logits: experimental
  chunked_prefill: experimental  # 7-token chunks equal one prefill on every row
  request_isolation: experimental  # a repeated request after an unrelated one is identical (sequential)
  concurrent_requests: untested
  chat_template_owned_text: experimental
  tokenizer_owned: experimental
  bundle_lock_verification: experimental
  cancellation_inside_a_step: unsupported
  conversation_state_reuse: unsupported
  tool_calling: unsupported
  vision: unsupported
  long_context: untested

compatibility:
  # Linux x64 CPU: onboarding route on 2026-10-18 (AVX2 desktop, two native threads). No gate.
  - os: linux
    arch: x64
    provider: cpu
    status: experimental
    verified: 2026-10-18
  - os: windows
    arch: x64
    provider: cpu
    status: untested

qualification:
  reference_runner: model-pipeline/reference/qwen-chat/run_reference.py
  # No protected fixtures exist for this profile. The reference is proposed: transformers fp32 CPU on the
  # Starling-written corpus below (14 conversations, 16 new tokens each, one with a 1-token limit).
  fixtures: model-pipeline/corpora/five-models/chat.jsonl
  # No protected tolerances: the predeclared candidate policy (evaluation.policy: exact prompt and greedy ids, step-0
  # logits within 5e-3 max and 5e-4 mean). Development result 2026-10-18: 14/14, worst 1.28e-4 max and
  # 3.67e-5 mean, .NET equal to Python GenAI. Adoption into protected/ is a separate change.
  tolerances: model-pipeline/candidates/qwen3/profile.json
  gates:
    G0: { status: not-run }
    G1: { status: not-run }
    G2: { status: not-run }
    G3: { status: not-run }
