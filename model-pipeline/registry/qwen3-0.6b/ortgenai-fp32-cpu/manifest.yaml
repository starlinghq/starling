behavior:
  tasks: [generation]
  # The model's context length from genai_config.json; GenerationContextLengthException before any native call when
  # prompt plus max_new_tokens exceed it. The development evidence covers prompts up to the long-prefill case only.
  max_input_tokens: 40960
  offsets_unit: none
  truncation: error
  defaults:
    decoding: greedy
    max_new_tokens: 16                 # QwenChatOptions default (the corpus setting); applications set their own
    stop_token_ids: [151645, 151643]   # <|im_end|>, <|endoftext|>; never part of the completion or the usage count
    enable_thinking: false             # fixed (QwenChatTemplate); differs from the upstream default (true)
    template: "qwen3-text-v1: no system message is inserted when none is given (upstream template)"
    stop_sequences: >-
      ordinal match on the completion text (StopSequenceMatcher); the text is cut before the first match and the
      matched string is not returned; the tokens that produced it stay in the completion ids and the usage count.
    usage: prompt tokens = ids fed to the model; completion tokens = generated ids excluding a stop token id.
    cancellation: checked before the prefill, between prefill chunks and between decode steps; a running chunk or step is not interrupted.
    request_state: one GenAI generator per request; requests share the weights only.
    native_threads: one or two (QwenChatModelOptions.IntraOpThreads)
    pad_token_id_overlay: >-
      151935 (the unused last embedding row) instead of 151643, because ONNX Runtime GenAI masks prompt positions equal
      to pad_token_id and 151643 is <|endoftext|>, which users can type.
  unsupported:
    - tool definitions, tool calls and tool messages (rejected by QwenChatTemplate)
    - image, audio and video content
    - Qwen3 thinking mode (enable_thinking true); earlier assistant reasoning is dropped as upstream does
    - sampling (greedy only; QwenChatOptions has no sampling settings)
    - batching several prompts in one generator
    - conversation state reuse across requests (each request renders and prefills the whole conversation)
    - cancellation inside a decode step or a prefill chunk (checked between them)
    - CUDA, fp16 and quantized graphs
    - the ONNX Runtime GenAI tokenizer and template engine

processing:
  tokenizer:
    package: Starlings.Tokenizers
    version: 0.3.0
    # The repository's tokenizer.json through Tokenizer.FromFile (no named profile); QwenChatProfile pins its digest
    # and checks the special-token identities.
    profile_id: tokenizer-json-unprofiled
    algorithm: byte-level-bpe
    assets:
      - path: tokenizer.json
        sha256: "aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4"
        size: 11422654
    # Prompt ids come from the owned tokenizer and completion text from its decoder; ONNX Runtime GenAI receives ids
    # only and its tokenizer is never loaded.
    backend_tokenizer_dependency: false
  template:
    asset:
      path: chat_template.jinja
      sha256: "a55ee1b1660128b7098723e0abcd92caa0788061051c62d51cbe87d9cf1974d8"
      size: 4168
    # C# port of the pinned template for text conversations (QwenChatTemplate, qwen3-text-v1); equal to
    # transformers apply_chat_template on the 14 corpus conversations (prompt text and ids).
    renderer: owned
  decoding:
    loop: Starlings.Generation.OnnxGenAI TextGenerator over the GenAI Generator (AppendTokens, GenerateNextToken)
    detokenization: incremental through the owned ByteLevel decoder; text is held back until a UTF-8 sequence completes
    token_selection: ONNX Runtime GenAI greedy search (do_sample false)

