rights:
  code_license: Apache-2.0
  weights_license: Apache-2.0
  tokenizer_terms: Apache-2.0
  # No public bundle exists: the graphs are not hosted, and whether Starling redistributes the merged weights or users
  # build them from the Hub at the pinned revisions is undecided (P-009, open). "blocked" is the schema's value for "no
  # public bundle"; it records that state, not a license obstacle.
  redistribution: blocked
  notes: >-
    Code: Apache-2.0 (LICENSE at the pinned Kev commit; pyproject.toml license = "Apache-2.0"); no source is copied, the
    C# package reimplements the rendering, encoder and head. Kev adapter and head: Apache-2.0 in the model card
    metadata (package README, "License"). Base weights and tokenizer: Apache-2.0 (LICENSE file of Qwen/Qwen3.5-4B-Base
    at the pinned commit, base/LICENSE above, the same bytes as the 0.8B base's). Apache-2.0 permits redistributing the
    merged fp32 graph with the license and attribution, but the redistribution decision (P-009) is open and nothing is
    hosted: there is no download, and users build the bundle (or receive it) and open it with
    KevModelAssets.OpenDirectory. Kev's training and evaluation datasets carry their own terms (some forbid public
    redistribution); no suite record is in this repository.

behavior:
  tasks: [decision]
  # Validated context (model cards, "Long documents"): states of at most 8,192 tokens, <state> included, and rows
  # (state plus one question's branch) of at most 8,192 tokens (upstream SERVE_MAX_BRANCH_8K). Longer inputs throw
  # KevInputTooLongException; nothing is truncated. Upstream serves up to 65,536 with accuracy loss above 8,192.
  max_input_tokens: 8192
  offsets_unit: none
  truncation: error
  defaults:
    temperature: >-
      2.406050072164233, the calibration temperature stored in head.pt (KevOptions.Temperature null). 1.0 gives the raw
      probabilities (upstream KEV_TEMPERATURE=1.0).
    question_types: noul (probability of yes), choice (1 to 255 options), score (1 to 255 levels)
    answers: >-
      unrounded probabilities. Choice is the first most likely key; Confidence is System One's (p_max - 1/K) / (1 - 1/K)
      (the score formula for score questions); ExpectedScore is sum(i * p_i).
    request_rendering: >-
      as kev/api.py and kev/model.py at 6b719c3c: JSON states rendered with Python str() of numbers and booleans, each
      segment tokenized alone without special tokens, and any <|name|> in user text rewritten to <¦name¦> so it can
      never become a delimiter.
    question_isolation: >-
      the state runs once; every question then runs as its own causal row continuing from the state's cache, so
      questions cannot influence one another (the cache lives for one request).
    delimiters: >-
      state 248060 <|fim_prefix|>, question 248061 <|fim_middle|>, option 248049 <|box_start|>, option end 248050
      <|box_end|> (the option key), decide 248062 <|fim_suffix|> (the question query), pad 248044 <|endoftext|>.
    pointer_head: >-
      projection width 256; each option's </opt> hidden state scored against the question's <decide>, divided by the
      temperature.
    concurrency: >-
      concurrent Decide calls on one model are independent on CPU (not serialized); four callers matched sequential
      calls bit for bit (ModelParityTests).
  unsupported:
    - states over 8,192 tokens and rows over 8,192 tokens (rejected, not truncated; KEV_TRUNCATE_STATES)
    - state prefix reuse across requests (upstream PrefixCache)
    - batching several requests or rows in one call
    - upstream's 4-decimal probability rounding and usage.output_tokens
    - KEV_DATE_FACTS date preprocessing
    - option isolation mode
    - the HTTP server and its endpoints (/v1/systemone/*, /v1/models, bearer auth)
    - bf16, fp16 and quantized graphs (midudev/kev-4b-ONNX, int4, included)
    - training, fine-tuning and calibration fitting
    - text generation (the graph has no LM head)
    - downloading the bundle (nothing is hosted)
    - Kev-9B and Kev-27B

processing:
  tokenizer:
    # The owned tokenizer pinned in ai-dotnet/Directory.Packages.props. Profile qwen2-bpe-kev is the Kev repositories'
    # tokenizer.json (the same bytes for both sizes), not the base file base/tokenizer.json (admissions/kev.md,
    # "Tokenizer profile").
    package: Starlings.Tokenizers
    version: 0.3.0-preview.1
    profile_id: qwen2-bpe-kev
    algorithm: byte-level-bpe
    assets:
      - path: tokenizer.json
        sha256: "06b9509352d2af50381ab2247e083b80d32d5c0aba91c272ca9ff729b6a0e523"
        size: 19989325
    # Token ids come from the owned tokenizer; ONNX Runtime receives ids only.
    backend_tokenizer_dependency: false
  decoding:
    reference: Kev's PyTorch fp32 path (Checkpoint.load on CPU, default LoadOptions) at code 6b719c3c
    readout: hidden_states at each </opt> and <decide> position; the pointer head runs in C# from head.safetensors

execution:
  backend:
    name: onnxruntime
    version: 1.30.0
    binding: Microsoft.ML.OnnxRuntime
  precision: fp32
  variant: reference
  graph:
    # onnxruntime-genai 0.17.1 builder (-p fp32 -e cpu --extra_options exclude_lm_head=true exclude_mtp=true) on the
    # fp32 merge written by model-pipeline/reference/kev/kev_merge.py (config.json set to float32). The export is
    # deterministic; the fp32 LoRA merge is not: two Kev-4B builds differ in 33 of 452 tensors, 1 to 4 floats each (at
    # most 1.9e-9 absolute), all LoRA-merged projections (package README, "The bundle"). The lock pins the bundle that
    # was measured.
    assets:
      - path: model.onnx
        sha256: "364540ffdadd6b7514c7a25d63e21cc3db61784a9a540835cd1458f8023b1cb5"
        size: 410133
      - path: model.onnx.data
        sha256: "e8abebf694f97fde5c7ebc70391c38a15bb9bf2bc07f49449f786faf3863a063"
        size: 16890920960
    hosting:
      # Not hosted: no repository, no address, no download (KevModelAssets has no download source). "placeholder" is
      # the registry's value for hosting that does not exist yet (tools/qualification.py treats it as not public).
      # Hosting under the Starlinghq organization is the maintainer's step, after P-009.
      source_status: placeholder
      produced_by:
        - model-pipeline/reference/kev/run_kev.py build (kev_merge.py, then the ONNX Runtime GenAI 0.17.1 builder)
    inputs:
      - { name: input_ids, type: int64, shape: [batch, sequence] }
      - { name: attention_mask, type: int64, shape: [batch, total_sequence] }
      - { name: position_ids, type: int64, shape: [3, batch, sequence] }
      - { name: "past_key_values.%d.key/value", type: kv-cache, shape: "8 full-attention layers (3, 7, ..., 31)" }
      - { name: "past.%d.conv/recurrent", type: recurrent-state, shape: "24 Gated DeltaNet layers" }
    outputs:
      - { name: hidden_states, type: float32, shape: [batch, sequence, 2560] }
      - { name: "present.%d.*", type: cache, shape: "the matching state after the input" }

capabilities:
  # Starlings.Models.Kev (KevCapabilities); evidence in the package README ("Evidence"). Statuses follow
  # KevCapabilities.All for the CPU provider (both sizes have the same statuses): experimental where the C# package was
  # compared with Kev's PyTorch fp32 path on the proposed corpus and fixtures (no adopted reference, no binding bound
  # for this checkpoint, no gate), unsupported where the package refuses or does not offer it, untested where no
  # evidence exists. KevCapabilities.Profiles holds the same statuses (tested key for key).
  batch: unsupported  # one request per call; rows are not batched
  streaming: unsupported  # one probability vector per question, nothing to stream
  cancellation: experimental
  persistence: unsupported  # the state cache lives for one request
  training: unsupported
  aot: untested
  extensions_ai: unsupported
  mlnet: unsupported
  decision_noul: experimental
  decision_choice: experimental
  decision_score: experimental
  calibrated_temperature: experimental
  raw_probabilities: experimental
  delimiter_escaping: experimental
  question_isolation: experimental
  state_cache_within_request: experimental
  state_json_rendering: experimental
  # Four callers on one model, every request golden twice each, bit-identical to sequential calls (ModelParityTests).
  concurrent_calls: experimental
  asset_verification_offline: experimental
  state_over_8192_tokens: unsupported  # refused, never truncated
  asset_acquisition_download: unsupported
  state_prefix_reuse_across_requests: unsupported
  probability_rounding: unsupported
  usage_output_tokens: unsupported
  date_facts: unsupported
  option_isolation: unsupported
  http_server: unsupported
  bf16: unsupported
  fp16: unsupported
  quantized: unsupported
  calibration_fitting: unsupported
  generation: unsupported
  non_english: unsupported

compatibility:
  # Linux x64 CPU: development evidence 2026-10-16 (package README, "Evidence"): onboarding route kev-onnx-cpu-v1 on
  # the Starling-written corpus, upstream's decision-v7 fixture records and transfer-v4 development partition through
  # Python ONNX Runtime, and the C# tests with the bundle. No gate.
  - os: linux
    arch: x64
    provider: cpu
    status: experimental
    verified: 2026-10-16
  # CUDA is the separate profile kev-4b/onnx-fp32-cuda (same bundle, use_tf32 0); this row mirrors its status.
  - os: linux
    arch: x64
    provider: cuda
    status: experimental
    verified: 2026-10-17
  - os: windows
    arch: x64
    provider: cpu
    status: untested

qualification:
  reference_runner: model-pipeline/reference/kev/run_kev.py
  # No protected fixtures exist for Kev. The reference is proposed, not adopted into protected/: Kev's PyTorch fp32
  # path on the Starling-written corpus below (30 records, 58 questions, 44 labelled; states up to 1,531 tokens) and
  # upstream's development partitions, run through the onboarding route kev-onnx-cpu-v1 (recipes/kev-4b-cpu.yaml).
  fixtures: model-pipeline/reference/corpus/kev-decisions-v1.jsonl
  # No protected tolerances exist for Kev-4B. The development evidence was judged against the Kev-0.8B values, applied
  # here as PROPOSED values only: the file below binds kev-0.8b (weights 9a45d25e), not this checkpoint, and the binding
  # bound for Kev-4B is the maintainer's decision. Development evidence (2026-10-16): Python ORT and .NET vs PyTorch
  # 6.49e-5 on the corpus (2e-4), cached vs uncached 2.5e-7 (1e-5), .NET vs Python ORT 1.81e-7 (1e-6), no flip,
  # identical accuracy (0.909 on 44) and token ids; decision-v7 fixture records (28 questions) 8.3e-5; transfer-v4
  # development (764 questions) 2.05e-4, one question 2.5% above the 0.8B value of 2e-4, with no flip and identical
  # accuracy (0.8171, n = 656). Kev-4B has 24 Gated DeltaNet layers against 18. Proposed reference: no gate.
  tolerances: model-pipeline/protected/kev-0.8b/onnx-fp32/tolerances.yaml
  gates:
    G0: { status: not-run }
    G1: { status: not-run }
    G2: { status: not-run }
    G3: { status: not-run }
    G4: { status: not-run }
    G5: { status: not-run }
    G6: { status: not-run }
    G7: { status: not-run }

maintenance:
  owner: Mark
  # main (also the Hub tag v1.0) is 6cfce5c2, with weights identical to the pinned commit (admissions/kev.md, "Upstream
  # inventory"; package README).
  latest_known_upstream_revision: "6cfce5c2fa4b4bd64026336ab649c5ca78857d52"
  latest_verified_upstream_revision: "139fdd94f1b6a6ad80cc15e08fcb99cac885a101"
  review_date: 2027-01-05
  known_issues:
    - >-
      No binding tolerance for Kev-4B: the protected file binds Kev-0.8B, and one transfer-v4 development question
      (2.05e-4) exceeds its 2e-4 probability bound by 2.5% (no flip, identical accuracy). The binding bound for 4B is
      the maintainer's decision.
    - >-
      Not hosted and no redistribution decision (P-009 open): there is no download. Build the bundle (about 17 GB) with
      model-pipeline/reference/kev/run_kev.py build (or receive it) and open it with KevModelAssets.OpenDirectory,
      which checks every file's size and SHA-256 (hashing the weights takes about a minute).
    - >-
      model.onnx.data is not byte-reproducible across builds (the fp32 LoRA merge; see execution.graph). The lock pins
      the measured bundle; a rebuilt bundle needs its own digests and its own evidence (KevDecisionModel.Create with
      explicit paths).
    - >-
      The references are proposed, not adopted into protected/, and no gate has run; every capability is at most
      experimental. The full decision-v7 development run for 4B (1,468 questions) was stopped for memory before it
      finished and is not reported.
    - >-
      Memory: about 18 GB resident, plus the state cache.
