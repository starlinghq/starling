# Kev decision model (P-027): jaredpalmer/kev-4b (Kev 1.0, a LoRA adapter and pointer head on Qwen/Qwen3.5-4B-Base)
# on ONNX Runtime 1.30.0, CUDA provider with use_tf32 0, through ai-dotnet/src/Starlings.Models.Kev
# (KevModelProfile.Kev4B.CudaId). Same bundle, lock and reference as kev-4b/onnx-fp32-cpu: the builder's CPU export run
# on the CUDA execution provider; the builder's own CUDA graph (-e cuda -p fp32) did not load unpatched with ONNX
# Runtime GenAI 0.17.1 (admissions/kev.md, "GPU results", on Kev-0.8B) and is not this profile.
# (KevModelAssets.Kev4BLock pins the bundle files; KevModelProfile.Kev4B the revisions and dimensions.) Admission:
# model-pipeline/admissions/kev.md (family admitted at Experimental, Mark, 2026-10-08, PR #4; Kev-4B is listed there as
# a Kev 1.0 checkpoint). Candidate contract: model-pipeline/candidates/kev-4b/profile.json (onboarding route
# kev-onnx-cpu-v1). No Hub repository ships an fp32 ONNX graph of Kev 1.0 (midudev/kev-4b-ONNX is int4 for the browser,
# onnx-community/kev-4b-ONNX the previous Qwen3 generation): the bundle is Starling's build from the pinned sources
# (route A: kev_merge.py fp32 LoRA merge, then the ONNX Runtime GenAI 0.17.1 builder -p fp32 -e cpu --extra_options
# exclude_lm_head=true exclude_mtp=true), listed in origin.files with its digests. The bundle is hosted publicly (Starlinghq/kev-4b-onnx, r1),
# references are proposed, no protected tolerances exist for this checkpoint, and no gate has run.
schema_version: 1
id: kev-4b/onnx-fp32-cuda
# Experimental (package README, "CUDA"): local development evidence on one RTX 3090 only, no per-release GPU
# regression, no gate ran, the bundle is hosted publicly (Starlinghq/kev-4b-onnx, r1), and the binding bound for Kev-4B is not set.
maturity: experimental

