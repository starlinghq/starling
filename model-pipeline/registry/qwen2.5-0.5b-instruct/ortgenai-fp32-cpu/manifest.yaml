# provider. Admission: model-pipeline/admissions/qwen-chat.md (proposed at Experimental, #124). Candidate contract:
# model-pipeline/candidates/qwen25/profile.json (onboarding route qwen-genai-cpu-v1, recipes/qwen25-cpu.yaml). The Hub
# repository ships no GenAI build: the graph is Starling's build of the pinned original
# (model-pipeline/reference/qwen-chat/build_bundle.py, builder 0.17.1 at 83de55a1), rebuilt byte-identically twice on
# 2026-10-18 and pinned by QwenChatProfile.BundleFiles. Hosted publicly at Starlinghq/qwen2.5-0.5b-instruct-ortgenai (r1); QwenChatModelAssets downloads it. The references are proposed, not
# adopted into protected/, and no gate has run.
