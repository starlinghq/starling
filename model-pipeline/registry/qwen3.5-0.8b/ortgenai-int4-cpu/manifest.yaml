# Pilot LLM, int4 on the CPU provider (issue #163, step 1): Qwen/Qwen3.5-0.8B on ONNX Runtime GenAI 0.17.1 through
# ai-dotnet/src/Starlings.Models.Qwen35.OnnxGenAI (Qwen35Variant.Int4; Qwen35ModelAssets pins the same files). The graph
# is M0's "int4x, -e cpu" build (docs/m0/generation-backend-check.md section 2): the float32 config overlay, builder
# -p int4 -e cpu (RTN, block 32, accuracy level 4, the builder's defaults), exclude_mtp=true
# (model-pipeline/reference/generation/build_ortgenai_bundle.py --variant int4). model.onnx.data is byte-identical to
# the M0 build. A quantized graph cannot match the transformers fp32 reference (M0: 1 of 22 sequences, 14 of 22 step-0
# argmax), so this profile's reference is the same graph run by the upstream Python binding
# (model-pipeline/reference/generation/run_genai_reference.py); the fixture is proposed, no tolerance is set.
# NOT HOSTED: the graph files have no download location (hosting is out of scope for this step). Build them locally into
# the snapshot layout and open them with Qwen35ModelAssets.OpenDirectory; Qwen35ModelAssets.DownloadAsync rejects the
# variant. Evidence: docs/evidence/qwen35-int4-cpu-2026-11-01/README.md.
schema_version: 1
id: qwen3.5-0.8b/ortgenai-int4-cpu
# Experimental: .NET equal to the Python binding on the proposed int4 fixture (22/22 greedy sequences, step-0
# log-probabilities bit-identical; evidence README); no gate ran, no
# maintainer tolerance or task-quality floor exists for int4 yet (issue #163, step 2).
maturity: experimental

origin:
  code:
    url: https://github.com/microsoft/onnxruntime-genai
    # Builder source: the rel-0.17.1 branch head (the repository has no v0.17.1 tag).
    revision: "83de55a1f3886cddbb32a5517e26adb3f9d65159"
  weights:
    url: https://huggingface.co/Qwen/Qwen3.5-0.8B
    revision: "2fc06364715b967f1860aea9cf38778875588b17"
  files:
    # Hub files the build and the runtime read (docs/m0/hub-pins.md, "Pilot LLM").
    - path: config.json
      sha256: "b90b86f35c8e6925ef74ee04d0e758f0a845c83a42089ad82bbaa948de9b4204"
      size: 2907
    - path: model.safetensors-00001-of-00001.safetensors
      sha256: "04b1c301231dd422b8860db31311ab2721511346a32cb1e079c4c4e5f1fe4696"
      size: 1746942600
    - path: model.safetensors.index.json
      sha256: "d8a08838a613b025eb7952ed9db11696213e57e76a375661ef5c12f9dd5dcf4e"
      size: 50900
    - path: chat_template.jinja
      sha256: "273d8e0e683b885071fb17e08d71e5f2a5ddfb5309756181681de4f5a1822d80"
      size: 7755
    - path: LICENSE
      sha256: "bbedc3fda3305820b977265f01b8619d87570a6739de3a5582c3464840f1e57a"
      size: 11544
    # Not in the Hub repository: Starling's local int4 build of the weights above (execution.graph) and the
    # transformers 5.18.0 runtime tokenizer the builder writes (processing.tokenizer). genai_config.json is
    # byte-identical to the fp32x build's.
    - path: transformers-5.18.0/tokenizer.json
      sha256: "a5cd9732badce41de57e6efce8302930ded1c1188c5f81feb2bd6c24c4a1941f"
      size: 19989339
    - path: ortgenai-int4/genai_config.json
      sha256: "e7e1957b2544fdad6170a9cc81cbbb1b88c8819b7016a609170ad7cbebba81ba"
      size: 1935
    - path: ortgenai-int4/model.onnx
      sha256: "a41f341f106a1bb5b50eb67ca824cd9c324705141d88b027de0888f140e39cf7"
      size: 364388
    - path: ortgenai-int4/model.onnx.data
      sha256: "709e08797497f609547f7aef1387cfb35bd0deb3f4039acf001f0680b23f9745"
      size: 541523968
  attribution: >-
    Qwen3.5-0.8B by the Qwen team, Alibaba Cloud (Qwen/Qwen3.5-0.8B, Apache-2.0). ONNX Runtime GenAI model builder by
    Microsoft (MIT).

rights:
  code_license: MIT
  weights_license: Apache-2.0
  tokenizer_terms: Apache-2.0
  # blocked: no public int4 bundle exists (users build it from the downloadable checkpoint).
  redistribution: blocked
  notes: >-
    Weights and tokenizer: Apache-2.0 (card front matter and the LICENSE file at the pinned commit). The int4 ONNX files
    are a conversion of those weights, which Apache-2.0 would permit redistributing with the license and attribution,
    but Starling does not redistribute them: the user builds them from the pinned checkpoint with the bundle script.
    Hosting them (as the fp32x and fp16x files are, in Starlinghq/qwen3.5-0.8b-ortgenai) is a separate decision.

behavior:
  tasks: [generation]
  # Same request contract and runtime overlays as the fp32x CPU profile (Qwen35ChatModel); only the graph differs.
  # Prompts above 1,666 tokens were not run on this variant.
  max_input_tokens: 8192
  offsets_unit: none
  truncation: error
  defaults:
    decoding: greedy
    max_new_tokens: 512
    stop_token_ids: [248046, 248044]   # <|im_end|>, <|endoftext|>; never part of the completion or the usage count
    enable_thinking: false
    prefill_chunk_tokens: "on CPU one call up to 1,024 prompt tokens and 1,024-token chunks above (Qwen35ChatOptions default)"
    pad_token_id_overlay: >-
      248319 (an embedding row the tokenizer never produces) instead of 248044, as on every Qwen3.5 profile.
    quality: >-
      Not fidelity to the checkpoint: int4 RTN changes the step-0 argmax on 8 of 22 development prompts and the whole
      greedy sequence on 21 of 22 against the transformers fp32 reference (M0). The claim is parity of the .NET runtime
      with the upstream Python binding on the same int4 graph. Task quality (GSM8K) is not measured for this profile.
  unsupported:
    - the CUDA provider (the graph is built for CPU; Qwen35ChatModel.Load rejects it)
    - downloading the graph (not hosted; build locally)
    - tool definitions on this variant are untested (the template path is shared with fp32x)
    - image and video content (the checkpoint's vision tower is not built)
    - batching several prompts in one generator
    - conversation state reuse and partial rewind (recurrent state)
    - cancellation inside a decode step or a prefill chunk (checked between them)
    - beam search, repetition penalties, min_length, logit processors
    - the MTP head and speculative decoding (built with exclude_mtp=true)
    - the ONNX Runtime GenAI tokenizer, template engine and bundled IChatClient

processing:
  tokenizer:
    package: Starlings.Tokenizers
    version: 0.3.4
    profile_id: qwen35-bpe-chat
    algorithm: byte-level-bpe
    assets:
      - path: transformers-5.18.0/tokenizer.json
        sha256: "a5cd9732badce41de57e6efce8302930ded1c1188c5f81feb2bd6c24c4a1941f"
        size: 19989339
    backend_tokenizer_dependency: false
  template:
    asset:
      path: chat_template.jinja
      sha256: "273d8e0e683b885071fb17e08d71e5f2a5ddfb5309756181681de4f5a1822d80"
      size: 7755
    renderer: owned
  decoding:
    loop: Starlings.Generation.OnnxGenAI TextGenerator over the GenAI Generator (AppendTokens, GenerateNextToken)
    detokenization: incremental through the owned ByteLevel decoder; text is held back until a UTF-8 sequence completes
    token_selection: ONNX Runtime GenAI greedy search (do_sample false), or its sampler with an explicit seed

execution:
  backend:
    name: onnxruntime-genai
    version: 0.17.1
    binding: Microsoft.ML.OnnxRuntimeGenAI
    binding_version: 0.17.1
  precision: int4
  variant: quantized
  graph:
    # onnxruntime-genai 0.17.1 builder (pip wheel 0.17.1+c98b9fc) from a copy of the snapshot whose config.json
    # declares float32 (sha256 295154cd6039372b0b16a30336b11deea6591320bf21ee4dc053a305684da311), -p int4 -e cpu,
    # --extra_options exclude_mtp=true: 151 MatMulNBits (4 bits, block 32, accuracy level 4) and a
    # GatherBlockQuantized embedding. Two builds on 2026-11-01 gave the same digests; model.onnx.data equals the M0
    # build, model.onnx differs from M0's recorded 766e49f3... (evidence README section 2). No hosting.
    inputs:
      - { name: input_ids, type: int64, shape: [batch, sequence] }
      - { name: attention_mask, type: int64, shape: [batch, total_sequence] }
      - { name: position_ids, type: int64, shape: [batch, sequence] }
      - { name: "past_key_values.%d.key/value", type: kv-cache, shape: "6 full-attention layers" }
      - { name: "past.%d.conv/recurrent", type: recurrent-state, shape: "18 Gated DeltaNet layers" }
    outputs:
      - { name: logits, type: float32, shape: [batch, sequence, 248320] }

capabilities:
  # Experimental where the int4 runs of the evidence README exercised it (parity with the Python binding on the 22
  # development prompts: greedy ids 22/22 and step-0 log-probabilities bit-identical; the fidelity tool's semantics
  # mode: max-token boundary, stop sequences, extra stop id, cancellation, two-thread concurrency, seeded sampling,
  # chunked prefill); untested where the code path is shared with fp32x but was not run on int4; unsupported where no
  # Qwen3.5 profile offers it. Cached versus fresh-prefill logits differ by up to 0.46 in log-probability on int4
  # (tokens equal on 12 of 12 steps), far above fp32x's protected 2e-4; see the evidence README.
  batch: unsupported
  streaming: experimental
  cancellation: experimental
  persistence: unsupported
  training: unsupported
  aot: untested
  extensions_ai: untested
  mlnet: unsupported
  greedy_generation: experimental
  sampling_seeded: experimental
  stop_tokens: experimental
  stop_sequences: experimental
  max_new_tokens: experimental
  usage: experimental
  concurrent_requests: experimental
  step0_logits: experimental
  chat_template_owned_text: experimental
  enable_thinking: experimental
  tokenizer_owned: experimental
  cancellation_inside_a_step: unsupported
  chunked_prefill: experimental
  conversation_state_reuse: unsupported
  tool_calling: untested
  reasoning_split: unsupported
  structured_output: unsupported
  vision: unsupported
  long_context_1667_to_8192_tokens: untested
  long_context_over_8192_tokens: unsupported
  # int4 weights (RTN, block 32): Experimental for this profile only; every other Qwen3.5 profile is unquantized.
  quantized: experimental

compatibility:
  # Linux x64 CPU (Intel i7-5820K, AVX2, shared host); no GPU was used.
  - os: linux
    arch: x64
    provider: cpu
    status: experimental
    verified: 2026-11-01
  - os: linux
    arch: x64
    provider: cuda
    status: unsupported
  - os: windows
    arch: x64
    provider: cpu
    status: untested

qualification:
  reference_runner: model-pipeline/reference/generation/run_genai_reference.py
  # Proposed, not protected: the same int4 graph through the upstream Python binding (onnxruntime-genai 0.17.1, CPU) on
  # the prompt ids of the accepted prompts-v1 fixture.
  fixtures: model-pipeline/proposed/qwen3.5-0.8b/ortgenai-int4-cpu
  # No tolerances file exists for this profile: setting the int4 bounds and the task-quality floor is the maintainer's
  # protected change (issue #163, step 2). Candidate values with their observations are in the evidence README.
  tolerances: docs/evidence/qwen35-int4-cpu-2026-11-01/README.md
  gates:
    G0: { status: not-run }
    G1: { status: not-run }
    G2: { status: not-run }
    G3: { status: not-run }
    G4: { status: not-run }
    G5: { status: not-run }
    G6: { status: not-run }
    G7: { status: not-run }

maintenance:
  owner: Mark
  latest_known_upstream_revision: "2fc06364715b967f1860aea9cf38778875588b17"
  latest_verified_upstream_revision: "2fc06364715b967f1860aea9cf38778875588b17"
  last_checked: 2026-11-01
  review_date: 2027-02-01
  known_issues:
    - >-
      Not hosted: users build the int4 graph from the pinned checkpoint with the bundle script (--variant int4) and
      open it with Qwen35ModelAssets.OpenDirectory.
    - >-
      Fidelity to the checkpoint is not claimed: against the transformers fp32 reference the int4 build agrees on 1 of
      22 greedy sequences (M0). No task-quality floor exists yet.
