rights:
  code_license: MIT
  weights_license: Apache-2.0
  tokenizer_terms: Apache-2.0
  redistribution: download
  notes: >-
    Weights and tokenizer: Apache-2.0 (card front matter and the LICENSE file at the pinned commit). The built ONNX
    files are a conversion of those weights; Apache-2.0 permits redistributing them with the license and attribution.
    code_license names the builder (onnxruntime-genai, MIT) and this repository's code (MIT). Hosting: every file in
    the snapshot layout, with README, NOTICE, LICENSE and SHA256SUMS, in the Hugging Face repository
    Starlinghq/qwen3.5-0.8b-ortgenai (execution.graph.hosting), public since 2026-10-14; downloading needs no
    token.

behavior:
  tasks: [generation]
  # The accepted sequence: prompt plus max_new_tokens up to 8,192 tokens (Qwen35ChatModel.MaxContextTokens; the model's
  # own context_length is 262,144). The reference evidence ends at an 8,213-token prompt with 32 greedy tokens; at
  # 16,391 tokens cached versus uncached decoding reached 4.1e-4, above the protected 2e-4. Longer requests fail with
  # GenerationContextLengthException before any native call; nothing is truncated (capability closure 2026-10-14).
  max_input_tokens: 8192
  offsets_unit: none
  truncation: error
  defaults:
    decoding: greedy
    max_new_tokens: 512
    stop_token_ids: [248046, 248044]   # <|im_end|>, <|endoftext|>; never part of the completion or the usage count
    enable_thinking: false             # the template default (an empty think block after the generation prompt)
    max_new_tokens_boundary: >-
      max_new_tokens bounds the completion tokens. When the limit is reached no further step runs, so a stop token that
      would come next is not generated and the finish reason is length (as transformers' max_new_tokens).
    stop_sequences: >-
      ordinal match on the completion text; the text is cut before the first match and the matched string is not
      returned; the tokens that produced it stay in the completion ids and the usage count.
    usage: prompt tokens = ids fed to the model; completion tokens = generated ids excluding a stop token id.
    cancellation: checked before the prefill, between prefill chunks and between decode steps; a running chunk or step is not interrupted.
    prefill_chunk_tokens: "512 on CUDA, one call on CPU (Qwen35ChatOptions default); a one-call prefill allocates about 1 MB of fp32 logits per prompt token"
    concurrency: >-
      serialized: on CUDA the native work of concurrent requests runs one call at a time (requests interleave step by step). Unserialized concurrent ONNX Runtime GenAI 0.17.1 generators on the CUDA provider produced wrong tokens (docs/evidence/p016-qwen35/README.md); that mode is unsupported.
    request_state: >-
      one GenAI generator per request; concurrent requests share the weights only. Each request renders and prefills
      the whole conversation (state reuse across turns is not offered: the template drops earlier think blocks, so the
      earlier state is not a prefix of the next rendering).
    pad_token_id_overlay: >-
      248319 (an embedding row the tokenizer never produces) instead of 248044, because ONNX Runtime GenAI masks prompt
      positions equal to pad_token_id and 248044 is <|endoftext|>, which users can type.
  unsupported:
    - tool definitions, tool calls and tool messages (the owned template renderer has no tools input)
    - image and video content (the checkpoint's vision tower is not built)
    - reasoning extraction (with enable_thinking the reasoning stays in the completion text)
    - batching several prompts in one generator
    - conversation state reuse and partial rewind (recurrent state)
    - cancellation inside a decode step or a prefill chunk (checked between them)
    - beam search, repetition penalties, min_length, logit processors
    - the MTP head and speculative decoding (built with exclude_mtp=true)
    - quantized variants (4-bit fidelity unusable in M0)
    - TF32 on CUDA
    - the ONNX Runtime GenAI tokenizer, template engine and bundled IChatClient

processing:
  # Tokenizer 0.1.0-preview.4 (2026-10-10) adds the Gemma BPE components; the byte-level BPE path is unchanged in
  # behavior and passes every qwen35-bpe-chat fixture and differential dump again (tokenizer test suite). Model gates
  # were not rerun.
  tokenizer:
    # 0.3.0-preview.1 is the published tokenizer (starlinghq/tokenizers): the qualified 0.1.0-preview.4 behavior plus BERT WordPiece components this profile does not use; every conformance fixture passes unchanged.
    package: Starlings.Tokenizers
    version: 0.3.0-preview.1
    profile_id: qwen35-bpe-chat
    algorithm: byte-level-bpe
    assets:
      - path: transformers-5.18.0/tokenizer.json
        sha256: "a5cd9732badce41de57e6efce8302930ded1c1188c5f81feb2bd6c24c4a1941f"
        size: 19989339
    # Prompt ids come from the owned tokenizer and completion text from its decoder; ONNX Runtime GenAI receives ids
    # only (Generator.AppendTokens) and its tokenizer is never loaded.
    backend_tokenizer_dependency: false
  template:
    asset:
      path: chat_template.jinja
      sha256: "273d8e0e683b885071fb17e08d71e5f2a5ddfb5309756181681de4f5a1822d80"
      size: 7755
    # C# port of the pinned template for text conversations (Qwen35ChatTemplate); P-029 qualifies it on a template
    # corpus. Equal to transformers 5.18.0 apply_chat_template on the 21 text prompts of prompts-v1.
    renderer: owned
  decoding:
    loop: Starlings.Generation.OnnxGenAI TextGenerator over the GenAI Generator (AppendTokens, GenerateNextToken)
    detokenization: incremental through the owned ByteLevel decoder; text is held back until a UTF-8 sequence completes
    token_selection: ONNX Runtime GenAI greedy search (do_sample false), or its sampler with an explicit seed

execution:
  backend:
    name: onnxruntime-genai
    version: 0.17.1
    binding: Microsoft.ML.OnnxRuntimeGenAI.Cuda
    binding_version: 0.17.1
  precision: fp16
  variant: reference
  graph:
    # onnxruntime-genai 0.17.1 builder from a copy of the snapshot whose config.json declares float32 (sha256
    # 295154cd6039372b0b16a30336b11deea6591320bf21ee4dc053a305684da311), -p fp16 -e cuda,
    # --extra_options exclude_mtp=true. Two builds give the same digests.
    hosting:
      # Download location of every file in the origin.files lock that Qwen35ModelAssets uses (chat_template.jinja,
      # transformers-5.18.0/tokenizer.json, ortgenai-*/): <source_base><path>. Public repository since
      # 2026-10-14 (private from 2026-10-10); a token, if set, is sent only to https://huggingface.co. The digests, not the address, pin the bytes.
      repository: https://huggingface.co/Starlinghq/qwen3.5-0.8b-ortgenai
      revision: "95a690c1774f144957cb7b76986a9126e8b1bb5f"
      source_base: https://huggingface.co/Starlinghq/qwen3.5-0.8b-ortgenai/resolve/95a690c1774f144957cb7b76986a9126e8b1bb5f/
      source_status: public
    inputs:
      - { name: input_ids, type: int64, shape: [batch, sequence] }
      - { name: attention_mask, type: int64, shape: [batch, total_sequence] }
      - { name: position_ids, type: int64, shape: [batch, sequence] }
      - { name: "past_key_values.%d.key/value", type: kv-cache, shape: "6 full-attention layers" }
      - { name: "past.%d.conv/recurrent", type: recurrent-state, shape: "18 Gated DeltaNet layers" }
    outputs:
      - { name: logits, type: float16, shape: [batch, sequence, 248320] }
  # CUDA provider options applied by the C# runtime (GenAIModelOptions). use_tf32 must be 0: ORT enables TF32 by
  # default, and with it fp32 diverged from the reference at a 1.02 logit margin (M0).
  provider_options:
    use_tf32: 0
    device_id: 0

capabilities:
  # Starlings.Models.Qwen35 (Qwen35Capabilities); evidence in docs/evidence/p016-qwen35/README.md. Experimental means
  # tested against the transformers fp32 reference on prompts-v1 and by the decode-loop unit tests, not qualified.
  batch: unsupported
  streaming: experimental
  cancellation: experimental
  persistence: unsupported
  training: unsupported
  # aot: Native AOT publish on Linux x64 against Microsoft.ML.OnnxRuntimeGenAI.Cuda 0.17.1, no trim/AOT warnings, typed
  # API and IChatClient on fp16x CUDA equal to JIT on CUDA (tools/aot-check-ai.sh --cuda; docs/evidence/capability-closure-2026-10-14/README.md).
  aot: experimental
  # extensions_ai: Fp16xCudaChatClientTests (capability closure 2026-10-14): on all 21 text prompts the IChatClient
  # response and streamed updates equal the typed fp16x model exactly, with usage and finish reason; cancellation and
  # serialized concurrent requests. The typed API is held to the profile's near-tie rule by the model tests.
  extensions_ai: experimental
  mlnet: unsupported
  greedy_generation: experimental
  sampling_seeded: experimental
  stop_tokens: experimental
  stop_sequences: experimental
  max_new_tokens: experimental
  usage: experimental
  concurrent_requests: "experimental"
  step0_logits: experimental
  chat_template_owned_text: experimental
  enable_thinking: experimental
  tokenizer_owned: experimental
  cancellation_inside_a_step: unsupported
  chunked_prefill: experimental
  conversation_state_reuse: unsupported
  # tool_calling: template, parser and IChatClient mapping are provider-independent and tested (corpus and scripted
  # sequences; real-model run on fp32x CPU only, not on CUDA). docs/evidence/qwen35-tool-calling/README.md
  tool_calling: experimental
  reasoning_split: unsupported
  structured_output: unsupported
  vision: unsupported
  # Long context (capability closure 2026-10-14, docs/evidence/capability-closure-2026-10-14/README.md): Fp16xCudaTests on prompts of 4,112 and
  # 8,213 tokens (proposed fixture): greedy ids within the profile's near-tie rule, step-0 within this profile's
  # protected bounds. Proposed fixture, protected bounds.
  long_context_1667_to_8192_tokens: experimental
  # Above 8,192 tokens: rejected with GenerationContextLengthException (no evidence that fp16x stays within bounds there).
  long_context_over_8192_tokens: unsupported

compatibility:
  - os: linux
    arch: x64
    provider: cuda
    status: experimental
    verified: 2026-10-10
  - os: windows
    arch: x64
    provider: cuda
    status: untested

qualification:
  reference_runner: model-pipeline/reference/generation/run_reference.py
  # Proposed (separate pull request): the transformers fp32 CPU reference on prompts-v1, shared by every profile of this
  # model. Tolerances are proposed as values in docs/evidence/p016-qwen35/README.md; the maintainer sets the binding file.
  fixtures: model-pipeline/protected/qwen3.5-0.8b/reference
  tolerances: model-pipeline/protected/qwen3.5-0.8b/ortgenai-fp16x-cuda/tolerances.yaml
  # CUDA G1/G2, 2026-10-14 (RTX 3090, use_tf32 0): the protected staged evaluator gave G1 passed, G2 passed on the accepted
  # development fixtures, which are not P-030 release sets, so the entries are checklist, not passed (docs/evidence/cuda-qualification-2026-10-14/).
  # P-030 release sets (accepted 2026-10-14, docs/kickoff.md), 2026-10-14: G1, G2, G3 passed on the release sets (docs/evidence/release-set-gates-2026-10-14/qwen35-ortgenai-fp16x-cuda/README.md).
  # G2 passed on the release prompts (2026-10-14): --modes parity,fixture-semantics with the full step-0 reference
  # vectors regenerated byte-identical to the recorded digests (32/32); full-vocabulary step 0 0.048 (0.15); cached vs uncached 0.053 (0.1); chunked prefill 0.040 (0.1); greedy 30/32 exact, 2 allowed near-tie divergences (docs/evidence/release-set-gates-2026-10-14/qwen35-ortgenai-fp16x-cuda/README.md).
  gates:
    G0: { status: checklist, evidence: docs/evidence/p016-qwen35/README.md, date: 2026-10-10 }
    G1: { status: passed, evidence: docs/evidence/release-set-gates-2026-10-14/qwen35-ortgenai-fp16x-cuda/README.md, date: 2026-10-14 }
    G2: { status: passed, evidence: docs/evidence/release-set-gates-2026-10-14/qwen35-ortgenai-fp16x-cuda/README.md, date: 2026-10-14 }
    G3: { status: passed, evidence: docs/evidence/release-set-gates-2026-10-14/qwen35-ortgenai-fp16x-cuda/README.md, date: 2026-10-14 }
    # G4 checklist: plan 10.1 LLM semantics (max tokens, stop, EOS, cache, chunked prefill, cancellation, isolation,
    # seeded sampling) in section 4; CUDA concurrency defect and serialization in section 5. No soak (plan 10.2).
    G4: { status: checklist, evidence: docs/evidence/p016-qwen35/README.md, date: 2026-10-10 }
    G5: { status: not-run }
    G6: { status: not-run }
    G7: { status: not-run }

maintenance:
  owner: Mark
  latest_known_upstream_revision: "2fc06364715b967f1860aea9cf38778875588b17"
  latest_verified_upstream_revision: "2fc06364715b967f1860aea9cf38778875588b17"
  last_checked: 2026-10-10
  review_date: 2027-01-05
  known_issues:
    - >-
      The ONNX Runtime GenAI C# API is labeled preview upstream; Starlings.Generation.OnnxGenAI isolates it.
      The runtime version must equal the builder version that wrote the graph (0.17.1).
    - >-
      fp16 differs from the fp32 reference at near ties (M0: 18 of 22 prompts identical, every divergence where the
      reference top-1 minus top-2 logit margin was below 0.015). P-016 run: docs/evidence/p016-qwen35/README.md.
    - >-
      Native runtime: Microsoft.ML.OnnxRuntimeGenAI.Cuda 0.17.1 brings Microsoft.ML.OnnxRuntime.Gpu 1.30.0 and needs the
      CUDA 13 runtime and cuBLAS on the loader path (not shipped). The schema has no field for native runtime, driver
      or GPU requirements; they are recorded here and in docs/evidence/p016-qwen35/README.md.
