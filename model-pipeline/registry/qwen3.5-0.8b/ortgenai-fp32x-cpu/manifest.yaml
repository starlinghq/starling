# Pilot LLM profile (P-016): Qwen/Qwen3.5-0.8B on ONNX Runtime GenAI 0.17.1, variant fp32x on the CPU provider,
# through ai-dotnet/src/Starlings.Models.Qwen35 (Qwen35ModelAssets pins the same files). Backend decision:
# docs/kickoff.md (settled 2026-10-08) and docs/m0/generation-backend-check.md. The Hub repository ships no GenAI build:
# the graph is Starling's reproducible build (model-pipeline/reference/generation/build_ortgenai_bundle.py: float32
# config overlay, builder -p fp32 -e cpu, exclude_mtp=true), listed in origin.files with its digests. Development fixtures
# and tolerances are proposed separately; nothing here is qualified.
