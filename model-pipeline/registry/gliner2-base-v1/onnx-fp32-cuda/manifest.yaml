  weights_license: Apache-2.0
  tokenizer_terms: Apache-2.0
  redistribution: download
  notes: >-
    Code: Apache-2.0 LICENSE file at the pinned GLiNER2 commit. Weights and tokenizer: Apache-2.0 in the model
    card front matter only (no LICENSE file in the Hub repository); the card names "multi-domain datasets" as
    training data without listing them. The backbone microsoft/deberta-v3-base is MIT. Apache-2.0 permits
