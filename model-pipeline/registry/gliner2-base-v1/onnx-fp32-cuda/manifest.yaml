# Draft (R4, docs/plan/production-readiness.md): GLiNER2 on the CUDA execution provider (use_tf32 0), same graph and
# reference as onnx-fp32-cpu. CUDA parity evidence: model-pipeline/protected/gliner2-base-v1/onnx-fp32-cuda/ (accepted
# with the CPU fixtures, PR #19; tolerances set 2026-10-10, PR #21). Not reviewed by the maintainer.
# Profile basis: P-014 spike (docs/m0/gliner2-p014.md) and the P-015 C# package
# ai-dotnet/src/Starlings.Models.Gliner2 (Gliner2ModelAssets.Lock pins the same files). Feature contract from
# docs/kickoff.md (settled 2026-10-08) and the maintainer's P-015 decisions (2026-10-10): English entity extraction with
# labels and threshold; offsets into the original text; inputs above 512 tokens rejected. The Hub repository ships no
# ONNX file: the graph is Starling's reproducible conversion (execution.graph), listed in origin.files with its
# digest. Development fixtures accepted (PR #19) and binding tolerances set (PR #21) on 2026-10-10.
schema_version: 1
id: gliner2-base-v1/onnx-fp32-cuda
# Stable since 2026-10-16 (maintainer's delegated promotion; docs/kickoff.md, "Stable CUDA profiles, first round"):
# every gate G0 to G7 passed (G4 and G5 in the binding RTX 3090 round, docs/evidence/qualification-2026-10-16-cuda/),
# the contract is the Starlings.Models.Gliner2 README's "Stable contract: CUDA" (Linux x64, RTX 3090,
# MALLOC_MMAP_THRESHOLD_=65536), and the per-release GPU regression (qualification workflow, job cuda (runpod), pinned
# to the RTX 3090) reruns the CUDA tests, G1 to G3 on the release sets and a soak smoke test. Every check of this
# profile passed in its first run, 38857860186 (on an RTX 4090, before the pin;
# docs/evidence/gpu-regression-2026-10-16/README.md).
maturity: stable

