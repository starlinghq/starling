    graph (maintainer decision 2026-10-10, P-015), with this attribution and the license in the package README.

behavior:
  tasks: [extraction]
  # GLiNER2 itself does not truncate: extract() runs any length through DeBERTa's relative attention (checked to
  # 1,329 tokens). 512 is the backbone's max_position_embeddings. Decision 2026-10-10: the C# package rejects texts
  # above 512 tokens (schema prefix included) with Gliner2InputTooLongException; nothing is truncated.
  max_input_tokens: 512
  # Fixtures record Unicode scalar values of the normalized text. The C# results carry both units, into the original
  # text: Start/End (UTF-16 code units) and ScalarStart/ScalarEnd (Unicode scalar values).
  offsets_unit: unicode-scalars
  truncation: error
  defaults:
    threshold: 0.5
    overlap: >-
      Per label, confidence-first greedy suppression of character-overlapping spans (GLiNER2's default for span
      checkpoints). Spans of different labels may overlap.
    max_span_width_words: 8
    text_normalization: >-
      '.' appended unless the text ends in . ! or ?. Upstream offsets index the normalized text and can end one past
      the input; the C# package maps them onto the input: end clamped to the input length, whitespace exposed by the
      clamp trimmed, spans covering only the appended '.' dropped, so Text == input[Start..End] always.
    result_order: >-
      descending confidence within each label, ties in start then width order. Order and thresholding compare exactly,
      except items whose reference confidences are within 2e-5 may swap, and a threshold flip is allowed only when the
      reference score is within 2e-5 of the threshold (maintainer decision 2026-10-10).
  unsupported:
    - relation extraction
    - structured (JSON) extraction
    - text classification (named candidate; kickoff decision)
    - inputs above 512 tokens (rejected, not truncated)
    - GLiNER2's plain output format (strings de-duplicated on lower-cased text)
    - per-label thresholds, dtype "str", regex validators, entity attributes
    - explicit overlap policies (allow, nested, flat, longest)
    - extract_long chunking and the max_len word cap
    - char word splitter (CJK) and non-English text
    - LoRA adapters, fp16 (quantize), torch.compile, flashdeberta
    - TF32 math (ORT CUDA EP use_tf32 1, the ORT default)
    - mixed label counts in one padded batch (graph input contract)

processing:
  # Tokenizer 0.1.0-preview.3 (2026-10-10) added the Qwen byte-level BPE components and 0.1.0-preview.4 (2026-10-10) the
  # Gemma BPE components (byte fallback, unknown token, String Split, Sequence/Replace/ByteFallback/Fuse decoders); the
  # Unigram path is unchanged in behavior and passes every tokenizer fixture of this profile again (tokenizer test suite).
  # Model gates were not rerun.
  tokenizer:
    # 0.3.0 (the code of 0.3.0-preview.1, released without a preview suffix) is the published tokenizer (starlinghq/tokenizers): the qualified 0.1.0-preview.4 behavior plus BERT WordPiece components this profile does not use; every conformance fixture passes unchanged.
    package: Starlings.Tokenizers
    version: 0.3.1
    profile_id: gliner2-base-v1-unigram
    algorithm: unigram
    assets:
      - path: tokenizer.json
        sha256: "1b7fbabfb4c690bed84c6793bfecae9b8dfe205751b04f9ffd1e76a1e7df9c16"
        size: 8650701
    backend_tokenizer_dependency: false
  decoding:
    reference_tokenizer: DebertaV2TokenizerFast (transformers 4.57.6, tokenizers 0.22.2), per word, no template
    word_splitter: GLiNER2 WhitespaceTokenSplitter (URL | email | @handle | word | single non-space), Python re semantics
    lower_casing: Python str.lower() on each word (full mapping), not the tokenizer's

execution:
  backend:
    name: onnxruntime
    version: 1.30.0
    binding: Microsoft.ML.OnnxRuntime.Gpu.Linux
    binding_version: 1.30.0
  precision: fp32
  variant: reference
  graph:
    # Route A, torch.onnx dynamo exporter (torch 2.14.1, requirements-export.txt), opset 18, then the release step that
    # strips the exporter's run-dependent metadata and inlines the weights (one file). Two exports of the same snapshot
    # give the same digest.
    asset:
      path: onnx/gliner2-entities-fp32.onnx
      sha256: "0ba2db95b18116906ae4ec21aa62ef493e69e0780dcfdfa98c4456ecf4123265"
      size: 829284599
      # Public Hugging Face repository since 2026-10-14 (Gliner2ModelAssets.ModelSourceIsPlaceholder = false).
      source: https://huggingface.co/Starlinghq/gliner2-base-v1-onnx/resolve/c02c3350a0dcaf0bd6d2878043cc6a4ba950dccb/gliner2-entities-fp32.onnx
      source_status: public
      produced_by:
        - model-pipeline/reference/gliner2/export_gliner2_onnx.py --routes A --exporters dynamo
        - model-pipeline/reference/gliner2/release_gliner2_onnx.py
    opset: 18
    inputs:
      - { name: input_ids, type: int64, shape: [batch, sequence] }
      - { name: attention_mask, type: int64, shape: [batch, sequence] }
      - { name: word_index, type: int64, shape: [batch, words] }
      - { name: schema_index, type: int64, shape: [batch, schema_slots] }
    outputs:
      - { name: count_logits, type: float32, shape: [batch, 20] }
      - { name: span_logits, type: float32, shape: [batch, labels, words, 8] }
      - { name: last_hidden_state, type: float32, shape: [batch, sequence, 768] }
  # CUDAExecutionProvider options. use_tf32 must be 0: ORT 1.30.0 defaults it to 1, and TF32 moves span logits by up
  # to 2.4, flips a near-threshold span and reorders a long case (protected/.../onnx-fp32-cuda/PROPOSED.md);
  # Starlings.Runtime.Onnx always sets it. ORT places 33 of 792 nodes of the dynamo graph on CPUExecutionProvider
  # (shape arithmetic: Concat, Slice, Squeeze, Reshape, Mul, Add) plus one Memcpy; 759 run on CUDA (placement.json).
  # The schema has no field for the execution provider name or the allowed fallback set.
  provider_options:
    use_tf32: 0

capabilities:
  # Starlings.Models.Gliner2 (P-015) over a CUDA session (use_tf32 0). Statuses follow the README's "Stable contract:
  # CUDA": supported where the release-set gates G1 to G3, G4 to G7 and the CUDA test project
  # (ai-dotnet/tests/Starlings.Models.Gliner2.Tests.Cuda, run by the per-release GPU regression) cover it on an RTX
  # 3090; experimental where only proposed cases or a one-time local run (Native AOT with the CUDA natives) do;
  # unsupported outside it. Gliner2Capabilities.Profiles holds the same statuses (tested key for key). Capability
  # closure 2026-10-14 (docs/evidence/capability-closure-2026-10-14/README.md): cancellation, concurrency, the
  # capability cases and AOT over CUDA.
  batch: supported
  streaming: unsupported
  cancellation: supported  # CudaParityTests: a 4,096-text batch cancelled after 50 ms threw at 53 ms; reuse gives the reference
  persistence: unsupported
  training: unsupported
  # aot: Native AOT publish on Linux x64 against Microsoft.ML.OnnxRuntime.Gpu.Linux 1.30.0, no trim/AOT warnings,
  # extraction on CUDA equal to JIT on CUDA (tools/aot-check-ai.sh --cuda).
  aot: experimental
  extensions_ai: unsupported
  mlnet: unsupported  # no ML.NET adapter package exists for GLiNER2
  entity_extraction: supported
  offsets_original_text: supported
  # concurrent_calls: serialized on CUDA (Gliner2ExtractorOptions.SerializeNativeCalls, the CUDA default). Unserialized
  # concurrent runs on one CUDA session returned wrong entities in 6 of 8 runs (four threads); that mode is unsupported.
  # Serialized: 8 of 8 runs equal to the sequential results.
  concurrent_calls: supported
  concurrent_calls_unserialized: unsupported
  # label_descriptions and count_gate_closed (capability closure 2026-10-14, docs/evidence/capability-closure-2026-10-14/README.md): 22 proposed
  # cases on public-domain text run by the pinned GLiNER2 (model-pipeline/proposed/gliner2-base-v1/capability-cases;
  # 11 with label descriptions, 12 where the count gate closes): inputs, gate and entities exact, logits within this
  # profile's protected tolerances. Proposed cases, protected bounds.
  label_descriptions: experimental
  count_gate_closed: experimental
  input_over_512_tokens: unsupported
  plain_deduplicated_output: unsupported
  mixed_label_sets_in_batch: unsupported
  classification: unsupported
  relation_extraction: unsupported
  structured_extraction: unsupported

compatibility:
  # Linux x64 CUDA on an NVIDIA GeForce RTX 3090 (Ampere): G1 to G3 on the release sets, G4 one-hour soak and G5
  # (binding round 2026-10-16, RunPod, driver 580.126.20). The per-release GPU regression (CUDA tests, G1 to G3, soak
  # smoke test) is pinned to the RTX 3090; its first run, 38857860186, ran before the pin on an RTX 4090, and every
  # check of this profile passed. Other GPUs, including the RTX 4090 (Ada): untested, outside the contract.
  - os: linux
    arch: x64
    provider: cuda
    status: supported
    verified: 2026-10-16
  - os: windows
    arch: x64
    provider: cuda
    status: untested

qualification:
  reference_runner: model-pipeline/reference/gliner2/run_gliner2_extraction.py
  # The reference is shared with onnx-fp32-cpu (same graph, PyTorch fp32 CPU; development fixtures accepted
  # 2026-10-10, PR #19; agent-written corpus, not the P-030 release set). CUDA parity, placement and environment:
  # protected/gliner2-base-v1/onnx-fp32-cuda/. Binding tolerances set 2026-10-10 (PR #21), valid only with use_tf32 0.
  fixtures: model-pipeline/protected/gliner2-base-v1/onnx-fp32-cpu
  tolerances: model-pipeline/protected/gliner2-base-v1/onnx-fp32-cuda/tolerances.yaml
  # CUDA G1/G2, 2026-10-14 (RTX 3090, use_tf32 0): the protected staged evaluator gave G1 passed, G2 passed on the accepted
  # development fixtures, which are not P-030 release sets, so the entries are checklist, not passed (docs/evidence/cuda-qualification-2026-10-14/).
  # P-030 release sets (accepted 2026-10-14, docs/kickoff.md), 2026-10-14: G1, G2, G3 passed on the release sets (docs/evidence/release-set-gates-2026-10-14/gliner2-onnx-fp32-cuda/README.md).
  gates:
    G0: { status: passed, evidence: docs/evidence/g0-provenance-2026-10-14/README.md, date: 2026-10-14 }
    G1: { status: passed, evidence: docs/evidence/release-set-gates-2026-10-14/gliner2-onnx-fp32-cuda/README.md, date: 2026-10-14 }
    G2: { status: passed, evidence: docs/evidence/release-set-gates-2026-10-14/gliner2-onnx-fp32-cuda/README.md, date: 2026-10-14 }
    G3: { status: passed, evidence: docs/evidence/release-set-gates-2026-10-14/gliner2-onnx-fp32-cuda/README.md, date: 2026-10-14 }
    G4: { status: passed, evidence: docs/evidence/qualification-2026-10-16-cuda/README.md, date: 2026-10-16 }
    G5: { status: passed, evidence: docs/evidence/qualification-2026-10-16-cuda/README.md, date: 2026-10-16 }
    G6: { status: passed, evidence: docs/evidence/g6-distribution-2026-10-14/README.md, date: 2026-10-14 }
    G7: { status: passed, evidence: docs/evidence/g7-integration-2026-10-14/README.md, date: 2026-10-14 }

maintenance:
  owner: Mark
  latest_known_upstream_revision: "55656fbfa01d3d4a77485e1a1eeeaf682990ccdf"
  latest_verified_upstream_revision: "55656fbfa01d3d4a77485e1a1eeeaf682990ccdf"
  last_checked: 2026-10-10
  review_date: 2027-01-05
  known_issues:
    - >-
      Contract hardware: an NVIDIA GeForce RTX 3090 (Ampere, sm_86), driver 580, CUDA 13 runtime. The CUDA gates G1 to
      G5 (G4 and G5 in the binding 2026-10-16 round) ran on RTX 3090s, and the per-release GPU regression is pinned to
      the RTX 3090 and refuses any other GPU (tools/ci/runpod.py). Its first run, 38857860186, landed on an RTX 4090
      (Ada) before the pin: every check of this profile passed there, but embeddinggemma-2/video-fp32-cuda failed G2
      (docs/evidence/gpu-regression-2026-10-16/README.md). Other NVIDIA GPUs, including the RTX 4090, are untested and
      outside the contract.
    - >-
      Linux memory: start the process with MALLOC_MMAP_THRESHOLD_=65536 (the Starlings.Models.Gliner2 README, "Memory on
      Linux"); the G4 soak and the per-release soak smoke test run with it.
    - >-
      Cancellation on CUDA completes the current run before throwing (no mid-graph termination, #61), so its latency is
      one chunk: about 50 ms for 8 long texts (docs/evidence/gliner2-cuda-wrong-output/README.md).
    - >-
      Results are ordered by confidence; most entity scores saturate to exactly 1.0 in fp32, so near-ties make the
      order sensitive to backend noise (ORT CUDA with TF32 reorders one 1,329-token case with the same entity set).
    - >-
      Upstream span offsets index the normalized text: a span that includes the appended '.' ends one past the
      original text (seen at threshold 0.0). The C# package maps such spans onto the input (behavior.defaults).
    - >-
      The hosted graph is public since 2026-10-14. The 0.1.0-preview.6 release drill downloaded it with no token into an
      empty cache, verified it and ran the sample offline (Linux x64, one machine); other platforms are untested.
    - >-
      The count gate (count_pred argmax 0 gives an empty result) never closed on the development corpus. The proposed
      capability cases (model-pipeline/proposed/gliner2-base-v1/capability-cases) add 12 public-text cases where it
      closes; they are not yet accepted fixtures.
    - >-
      CUDA parity evidence (PROPOSED.md) left out the two cases over 600 tokens from the padded-batch check because
      the GPU was shared; single-row parity covers all 58 cases (span logits max abs 4.0e-3, scores 2.5e-6).
    - >-
      Native runtime: Microsoft.ML.OnnxRuntime.Gpu.Linux 1.30.0 needs the CUDA 13 runtime and cuDNN 9 on the loader
      path; the package does not ship them.
