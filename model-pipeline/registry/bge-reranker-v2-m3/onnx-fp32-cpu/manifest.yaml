# BERT route (Starlings.Models.Bert): Starlinghq/bge-reranker-v2-m3-onnx on ONNX Runtime 1.30.0, fp32 on the CPU provider. Candidate
# contract: model-pipeline/candidates/bge-reranker-v2-m3/profile.json (onboarding route bert-onnx-cpu-v1,
# recipes/bge-reranker-v2-m3-cpu.yaml), admitted to the route in #146 (closes #99); BertModelProfile.BuiltIn("bge-reranker-v2-m3") embeds the same
# file. Registry manifest added at Experimental in the ai-dotnet 0.4.0 release candidate at the maintainer's request, so
# the package README states its maturity. No admission record exists for the BERT route; the references are proposed,
# not adopted into protected/, and no gate has run.
