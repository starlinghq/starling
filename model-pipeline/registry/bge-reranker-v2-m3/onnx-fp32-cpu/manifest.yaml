rights:
  code_license: MIT OR Apache-2.0
  weights_license: Apache-2.0
  tokenizer_terms: Apache-2.0
  redistribution: download
  notes: >-
    Weights and tokenizer: Apache-2.0 (license: apache-2.0 in the model card front matter of BAAI/bge-reranker-v2-m3 at 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e (README.upstream.md in the hosting repository)). code_license is this repository's (the C# package
    reimplements the pipeline; no upstream source is copied). Nothing is bundled in the package: the application
    downloads the pinned files explicitly (ModelAssetStore.DownloadAsync(profile.RuntimeLock)) from the public Starling hosting repository Starlinghq/bge-reranker-v2-m3-onnx, verified by size and SHA-256.

behavior:
  tasks: [reranking]
  # Including special tokens (BertModelProfile.MaxTokens).
  max_input_tokens: 8192
  offsets_unit: none
  # Longest-first truncation by the pinned tokenizer (candidate behavior.truncation longest_first): a single text loses its
  # right end; a pair shortens its longer side first.
  truncation: truncate-right
  defaults:
    score: raw logit of the single output (identity activation); not a calibrated probability
    pair_encoding: "<s> query </s></s> document </s>, no segment ids"
    truncation: longest-first over the pair, special tokens included (the pinned tokenizer's policy)
    ranking: BertReranker.Rank orders by descending score, ties in input order
    batching: right padding with mask 0, maxBatchSize rows per call (default 32); maxBatchTokens and sortByLength opt-in (experimental)
    threads: two intra-op, one inter-op (Create threads argument)
  unsupported:
    - "GPU execution providers (CUDA, DirectML, CoreML)"
    - "fp16, bf16 and quantized graphs"
    - "streaming"
    - "training and fine-tuning"
    - "Microsoft.Extensions.AI and ML.NET adapters"
    - "FlagEmbedding fp16 inference"
    - "LLM-based and layerwise bge rerankers"
    - "per-side max_length (query/passage) truncation; truncation is longest-first over the pair"
    - "sigmoid-normalized scores (apply a sigmoid yourself)"

processing:
  tokenizer:
    # The owned tokenizer pinned in ai-dotnet/Directory.Packages.props; ONNX Runtime receives ids only.
    package: Starlings.Tokenizers
    version: 0.3.4
    profile_id: xlmr-unigram
    algorithm: unigram
    assets:
      - path: tokenizer.json
        sha256: "69564b696052886ed0ac63fa393e928384e0f8caada38c1f4864a9bfbf379c15"
        size: 17098273
    backend_tokenizer_dependency: false

execution:
  backend:
    name: onnxruntime
    version: 1.30.0
    binding: Microsoft.ML.OnnxRuntime
  precision: fp32
  variant: reference
  graph:
    # BertModelProfile.RuntimeLock: these graph files and tokenizer.json at the pinned revision.
    assets:
      - path: onnx/model.onnx
        sha256: "905f6c02919c0dbed213d922e097e06aa9787088a8f5173efa1d00d722948394"
        size: 551401
      - path: onnx/model.onnx_data
        sha256: "61f3e7229e6c1cc5e8e3d09f7657210a9cc15247cd6944ac60303e1b900a7f9b"
        size: 2271023104
    hosting:
      # Public repository (tag r1); the digests, not the address, pin the bytes.
      repository: https://huggingface.co/Starlinghq/bge-reranker-v2-m3-onnx
      revision: "047d4622e93d347828457e8a13bccd997fb6a969"
      source_base: https://huggingface.co/Starlinghq/bge-reranker-v2-m3-onnx/resolve/047d4622e93d347828457e8a13bccd997fb6a969/
      source_status: public
      produced_by:
        - model-pipeline/reference/bert/export_reranker_onnx.py (TorchScript ONNX exporter, opset 17, fp32, external data)
    inputs:
      - { name: input_ids, type: int64, shape: [batch, sequence] }
      - { name: attention_mask, type: int64, shape: [batch, sequence] }
    outputs:
      - { name: logits, type: float32, shape: [batch, 1] }

capabilities:
  # Starlings.Models.Bert (BertCapabilities). Experimental where the onboarding route compared the C# package with the
  # framework reference on the proposed corpus (no adopted reference, no gate); unsupported where the package does not
  # offer it; untested where no evidence exists.
  batch: experimental
  streaming: unsupported
  cancellation: experimental  # between batch chunks and at ONNX Runtime graph-node boundaries
  persistence: unsupported
  training: unsupported
  aot: untested
  extensions_ai: unsupported
  mlnet: unsupported
  text: experimental
  batch_token_budget: experimental  # maxBatchTokens, off by default
  batch_sort_by_length: experimental  # sortByLength, off by default
  asset_verification_offline: experimental
  built_in_profile: experimental  # BertModelProfile.BuiltIn("bge-reranker-v2-m3")
  gpu: unsupported

compatibility:
  # Linux x64 CPU: development evidence from the onboarding route (#146 (closes #99)). No gate.
  - os: linux
    arch: x64
    provider: cpu
    status: experimental
  - os: windows
    arch: x64
    provider: cpu
    status: untested

