# Binding tolerances, set by Mark on 2026-10-11, plan 10.1. Values from docs/m0/embeddinggemma2-video-spike.md.
# Reference: transformers 5.19.0 / sentence-transformers 6.1.0 / torchcodec 0.17.0 fp32 CPU (requirements-video.txt).
# The evaluator has no video task yet; until it does, the video package tests enforce these bounds.
# Valid only with use_tf32=0; TF32 on (ORT default) drifts to 4.9e-4.
# Observed worst (RTX 4060 Ti, use_tf32=0): embedding 1.1e-6 (Python ORT), 4.5e-7 (C#).
profile: embeddinggemma-2/video-fp32-cuda
provider_options: { use_tf32: 0 }
discrete:
  frame_indices: exact
  token_ids: exact
  decoded_frames: exact
  resized_pixels: exact
  pixel_values: exact
  video_positions: exact
float:
  # Row-relative: per row, max|d| / max|ref row| <= bound.
  soft_tokens_row_relative: 1.0e-3
  token_embeddings_row_relative: 1.0e-3
  embedding_max_abs: 1.0e-5
  min_cosine: 0.9999995
  padded_batch_vs_single_embedding_max_abs: 1.0e-5
  nan_or_inf: fail
  report_only: [mean_abs, p99_abs, per_value_relative]
decoder_ffmpeg:
  # The FFmpeg adapter (user-supplied LGPL FFmpeg 8.x, x86-64) must reproduce torchcodec's decoded RGB exactly on the
  # same FFmpeg major. Other decoders and FFmpeg majors are reported, not gated.
  decoded_rgb_vs_torchcodec: exact
  supported_ffmpeg_major: 8
