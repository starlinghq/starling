# Binding tolerances for whisper-large-v3-turbo on ONNX Runtime 1.30.0, CPU provider, fp16 graphs (plan 10.1).
# Adopted unchanged from the proposed policy of model-pipeline/candidates/whisper-large-v3-turbo/profile.json
# (onboarding route whisper-onnx-cpu-v1, #136; corrected encoder position split, #136 review).
#
# Evidence: model-pipeline run of recipes/whisper-large-v3-turbo-cpu.yaml at 69006a8 (the code merged as d72a67f;
# outputs bit-identical to the #136 run at dd87699), 53/53 checks passed, CPU, 2 threads. Corpus: four LibriSpeech
# dev-clean clips, 1.6 s to 12.5 s (reference/corpus/asr-corpus-v1.jsonl). Reference: transformers 5.18.0
# WhisperForConditionalGeneration, PyTorch 2.14.1 fp32 CPU, openai/whisper-large-v3-turbo 41f01f3f. Graphs:
# onnx-community/whisper-large-v3-turbo-ONNX 76ba4fb5 (encoder_model_fp16.onnx, decoder_model_fp16.onnx).
#
# Observed worst against each bound:
#   mel (.NET vs reference numpy path)              1.2e-7    mel_max_abs             1e-6
#   mel, torch vs numpy feature path (reference)    2.4e-5    mel_path_max_abs        1e-4
#   encoder hidden, audio positions (fp16 vs fp32)  1.2e-2    hidden_max_abs          0.05 (re-adopted 0.6, below)
#   encoder hidden, zero-padded tail (fp16 vs fp32) 5.4e-1    hidden_padding_max_abs  1.0
#   teacher-forced logits (fp16 vs fp32)            3.6e-2    logits_max_abs          0.1
#   .NET vs Python ONNX Runtime, hidden and logits  0         same_backend_max_abs    1e-5
#   word error rate, .NET and Python ORT vs ref     0         reference_wer_max       0
#   corpus word error rate, ref vs LibriSpeech text 0.018     ground_truth_wer_max    0.2
#
# Re-adopted hidden_max_abs (#221): 0.05 held for the four clips above (all <= 12.5 s) but not for 20 to 30 s audio.
# The fp16 encoder's drift from the fp32 reference on audio positions (max over positions, ORT 1.30 CPU vs PyTorch
# 2.14.1 fp32, one 30 s window each):
#   single LibriSpeech utterance 1272-135031-0024, 14.5 s           0.013
#   single LibriSpeech utterance 1272-128104-0009, 18.3 s           0.025
#   composite 1272-135031-0003..0008, 0.5 s zero gaps, 27.9 s      0.110   (asr-corpus-v2; failed 0.05 in #226)
#   same utterances joined with 0.5 s low-level noise, 27.9 s      0.213
#   single LibriSpeech utterance 1272-128104-0004, 29.4 s           0.173
#   same six utterances joined without gaps, 25.4 s               0.498   (worst observed)
# Margin rule: 1.2 x the worst observed value, rounded up to one significant figure: 1.2 x 0.498 = 0.598 -> 0.6. The
# route's cap for this key is twice the bound (1.2), as for hidden_padding_max_abs. Teacher-forced logits stay within
# logits_max_abs (worst 0.036), and ids, transcripts and segment timestamps are exact on every clip; every other key is
# unchanged.
#
# Evidence for kv_logits_max_abs (#192, PR #231); adopted in PR #233: the KV-cache decoder loop (decoder_with_past_model_fp16.onnx) against the
# full-context decoder teacher-forced on the same ids, same backend (Python ONNX Runtime 1.30 CPU, fp16 graphs). Not
# bit-identical: the fp16 graphs sum over the whole prefix in one product on one path and one row at a time on the
# other (ORT_DISABLE_ALL with one thread still differs by up to 4e-3). Evidence: model-pipeline run of
# recipes/whisper-large-v3-turbo-cpu.yaml on #231 with #229 (7583dcf), 194/194 checks, asr-corpus-v3, 2 threads.
# Per clip, max (mean) abs over every generated step:
#   librispeech-1272-128104-0000                   0.0042 (7.1e-4)
#   librispeech-1272-135031-0009                   0.0024 (5.4e-4)
#   librispeech-1272-128104-0002                   0.0101 (1.0e-3)   (worst observed)
#   librispeech-1272-141231-0013                   0.0016 (3.8e-4)
#   composite 1272-135031-0003..0008, 27.9 s       0.0062 (8.5e-4)
#   composite 1272-128104-0009..0011 cut at 30 s   0.0061 (8.8e-4)
# KV-cache ids, windows, segments and transcripts equal the full-context loop's on every clip (long-form included), and
# .NET's KV loop equals Python's bit for bit. Margin rule: about 2 x the worst observed, rounded to one significant
# figure: 2 x 0.0101 = 0.0202 -> 0.02. The route caps this key at 0.1.
#
# The encoder hidden state is bounded separately on the positions whose receptive field holds audio and on the
# zero-padded tail. On the original four clips (1.6 s to 12.5 s), fp16 drift concentrated on the padded (log-mel
# floor) frames (0.16 to 0.54 there, at most 0.012 on audio positions). Longer clips show greater audio-position drift,
# as measured above. One bound loose enough for the tail would hide a regression on the frames the transcript depends
# on. The fixed keys (mel, same backend, ids, transcripts, ground-truth sanity bound, non-finite, required paths) are
# correctness checks, not fp16 fidelity, and stay at the route's predeclared template.
profile: whisper-large-v3-turbo/onnx-fp16-cpu
reference: transformers 5.18.0 WhisperForConditionalGeneration, PyTorch fp32 CPU; log-mel from WhisperFeatureExtractor (numpy path)
policy:
  mel_max_abs: 1.0e-6
  mel_path_max_abs: 1.0e-4
  hidden_max_abs: 0.6
  hidden_padding_max_abs: 1.0
  logits_max_abs: 0.1
  kv_logits_max_abs: 0.02
  same_backend_max_abs: 1.0e-5
  token_ids: exact
  transcript: exact
  reference_wer_max: 0.0
  ground_truth_wer_max: 0.2
  non_finite: fail
  required_paths: [reference, python-onnx, dotnet-mel, dotnet-audio]
report_only: [mean_abs]
