[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "model-pipeline"
version = "0.1.0"
description = "Model registry, manifests, reference runners, and evaluation for Starlings."
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # The intervention graph compiler's tests build and run ONNX graphs (src/model_pipeline/interventions/).
    "numpy>=2.0",
    "onnx==1.23.1",
    "onnxruntime==1.30.0",
]
# ONNX Runtime interventions: the graph compiler (model_pipeline.interventions). onnxruntime matches the C#
# Microsoft.ML.OnnxRuntime pin in ai-dotnet/Directory.Packages.props.
interventions = [
    "numpy>=2.0",
    "onnx==1.23.1",
    "onnxruntime==1.30.0",
]

[project.scripts]
model-pipeline = "model_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
